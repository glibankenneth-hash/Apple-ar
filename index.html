<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Children's Book</title>


<!-- =========================================================
     A-FRAME
     ========================================================= -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


<!-- =========================================================
     MINDAR IMAGE TRACKING
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<!-- =========================================================
     STYLE
     ========================================================= -->

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

}

a-scene {

    width: 100%;
    height: 100%;

}

canvas {

    touch-action: none !important;

}


/* Hide MindAR's default UI */

.mindar-ui-loading,
.mindar-ui-scanning,
.mindar-ui-error {

    display: none !important;

}

</style>

</head>


<body>


<!-- =========================================================
     AR SCENE
     ========================================================= -->

<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;

        autoStart: true;

        uiScanning: no;
        uiLoading: no;
        uiError: no;

        warmupTolerance: 1;
        missTolerance: 1;

        filterMinCF: 0.0005;
        filterBeta: 0.001;

        maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
>


<!-- =========================================================
     ASSETS
     ========================================================= -->

<a-assets>

    <a-asset-item
        id="appleModel"
        src="./Apple.glb">
    </a-asset-item>

    <a-asset-item
        id="ballModel"
        src="./Ball.glb">
    </a-asset-item>

</a-assets>


<!-- =========================================================
     CAMERA
     ========================================================= -->

<a-camera
    position="0 0 0"
    look-controls="enabled: false">
</a-camera>


<!-- =========================================================
     APPLE TARGET
     Target Index 0
     ========================================================= -->

<a-entity
    id="appleTarget"
    mindar-image-target="targetIndex: 0"
>

    <!-- Orientation correction -->

    <a-entity id="appleOrientation">

        <!-- User rotation -->

        <a-entity id="appleRotation">

            <a-gltf-model

                id="apple"

                src="#appleModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="4.54545 4.54545 4.54545"

                visible="false"

            ></a-gltf-model>

        </a-entity>

    </a-entity>

</a-entity>


<!-- =========================================================
     BALL TARGET
     Target Index 1
     ========================================================= -->

<a-entity
    id="ballTarget"
    mindar-image-target="targetIndex: 1"
>

    <!-- Orientation correction -->

    <a-entity id="ballOrientation">

        <!-- User rotation -->

        <a-entity id="ballRotation">

            <a-gltf-model

                id="ball"

                src="#ballModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="4.54545 4.54545 4.54545"

                visible="false"

            ></a-gltf-model>

        </a-entity>

    </a-entity>

</a-entity>


</a-scene>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

const THREE = AFRAME.THREE;


/* =========================================================
   ELEMENTS
   ========================================================= */

const appleTarget =
    document.querySelector("#appleTarget");

const ballTarget =
    document.querySelector("#ballTarget");

const appleOrientation =
    document.querySelector("#appleOrientation");

const ballOrientation =
    document.querySelector("#ballOrientation");

const appleRotation =
    document.querySelector("#appleRotation");

const ballRotation =
    document.querySelector("#ballRotation");

const apple =
    document.querySelector("#apple");

const ball =
    document.querySelector("#ball");


/* =========================================================
   CURRENT ACTIVE TARGET

   0 = Apple
   1 = Ball
   null = Nothing
   ========================================================= */

let activeTarget = null;


/* =========================================================
   FLOOR ROTATION

   When the page is lying flat on the floor,
   rotate the object so it stands upward
   from the bottom of the page.
   ========================================================= */

const FLOOR_CORRECTION =
    new THREE.Quaternion().setFromEuler(

        new THREE.Euler(

            -Math.PI / 2,
            0,
            0,
            "XYZ"

        )

    );


/* =========================================================
   IDENTITY ROTATION

   Used when the page is vertical.
   ========================================================= */

const IDENTITY =
    new THREE.Quaternion();


/* =========================================================
   GET TARGET ORIENTATION

   Determines whether the tracked page is:

   - vertical
   - horizontal / floor

   ========================================================= */

function applyOrientation(target, orientation) {

    if (!target || !orientation) return;


    const targetQuaternion =
        target.object3D.quaternion;


    const normal =
        new THREE.Vector3(0, 0, 1);

    normal.applyQuaternion(targetQuaternion);


    /*
        If Y is close to zero,
        the page is approximately vertical.

        If Y is large,
        the page is approximately horizontal.
    */

    const isVertical =
        Math.abs(normal.y) < 0.5;


    if (isVertical) {

        orientation.object3D.quaternion.copy(
            IDENTITY
        );

    } else {

        orientation.object3D.quaternion.copy(
            FLOOR_CORRECTION
        );

    }

}


/* =========================================================
   APPLE ACTIVATION
   ========================================================= */

function activateApple() {

    activeTarget = 0;


    /*
        Hide Ball immediately.
    */

    ball.setAttribute(
        "visible",
        false
    );


    /*
        Show Apple immediately.
    */

    apple.setAttribute(
        "visible",
        true
    );


    /*
        Apply current page orientation.
    */

    applyOrientation(
        appleTarget,
        appleOrientation
    );

}


/* =========================================================
   BALL ACTIVATION
   ========================================================= */

function activateBall() {

    activeTarget = 1;


    /*
        Hide Apple immediately.
    */

    apple.setAttribute(
        "visible",
        false
    );


    /*
        Show Ball immediately.
    */

    ball.setAttribute(
        "visible",
        true
    );


    /*
        Apply current page orientation.
    */

    applyOrientation(
        ballTarget,
        ballOrientation
    );

}


/* =========================================================
   TARGET FOUND
   ========================================================= */

appleTarget.addEventListener(
    "targetFound",
    function () {

        /*
            Switch immediately.

            No frame waiting.
            No artificial delay.
        */

        activateApple();

    }
);


ballTarget.addEventListener(
    "targetFound",
    function () {

        /*
            Switch immediately.

            No frame waiting.
            No artificial delay.
        */

        activateBall();

    }
);


/* =========================================================
   TARGET LOST
   ========================================================= */

appleTarget.addEventListener(
    "targetLost",
    function () {

        /*
            Only hide Apple if Apple
            is still the active target.

            This prevents an old targetLost
            event from hiding the new object.
        */

        if (activeTarget === 0) {

            apple.setAttribute(
                "visible",
                false
            );

            activeTarget = null;

        }

    }
);


ballTarget.addEventListener(
    "targetLost",
    function () {

        /*
            Only hide Ball if Ball
            is still the active target.
        */

        if (activeTarget === 1) {

            ball.setAttribute(
                "visible",
                false
            );

            activeTarget = null;

        }

    }
);


/* =========================================================
   CONTINUOUS ORIENTATION UPDATE

   This keeps the object correctly oriented
   while the physical page is being rotated.
   ========================================================= */

function orientationLoop() {


    if (activeTarget === 0) {

        applyOrientation(
            appleTarget,
            appleOrientation
        );

    }


    if (activeTarget === 1) {

        applyOrientation(
            ballTarget,
            ballOrientation
        );

    }


    requestAnimationFrame(
        orientationLoop
    );

}


orientationLoop();


/* =========================================================
   TOUCH / POINTER CONTROL
   ========================================================= */

const scene =
    document.querySelector("a-scene");


let pointerDown = false;

let lastX = 0;

let lastY = 0;


/* =========================================================
   PINCH VARIABLES
   ========================================================= */

let pinchActive = false;

let initialPinchDistance = 0;

let initialScale = 4.54545;


/* =========================================================
   GET ACTIVE ROTATION OBJECT
   ========================================================= */

function getActiveRotation() {

    if (activeTarget === 0) {

        return appleRotation;

    }

    if (activeTarget === 1) {

        return ballRotation;

    }

    return null;

}


/* =========================================================
   GET ACTIVE MODEL
   ========================================================= */

function getActiveModel() {

    if (activeTarget === 0) {

        return apple;

    }

    if (activeTarget === 1) {

        return ball;

    }

    return null;

}


/* =========================================================
   POINTER DOWN
   ========================================================= */

scene.addEventListener(
    "pointerdown",
    function (event) {

        pointerDown = true;

        lastX = event.clientX;

        lastY = event.clientY;

    }
);


/* =========================================================
   POINTER MOVE
   ========================================================= */

scene.addEventListener(
    "pointermove",
    function (event) {

        if (!pointerDown) return;

        if (pinchActive) return;


        const rotation =
            getActiveRotation();


        if (!rotation) return;


        const deltaX =
            event.clientX - lastX;


        const deltaY =
            event.clientY - lastY;


        /*
            Horizontal movement rotates
            around vertical axis.

            Vertical movement rotates
            around horizontal axis.
        */

        rotation.object3D.rotation.y
            += deltaX * 0.01;


        rotation.object3D.rotation.x
            += deltaY * 0.01;


        lastX = event.clientX;

        lastY = event.clientY;

    }
);


/* =========================================================
   POINTER UP
   ========================================================= */

scene.addEventListener(
    "pointerup",
    function () {

        pointerDown = false;

    }
);


scene.addEventListener(
    "pointercancel",
    function () {

        pointerDown = false;

    }
);


/* =========================================================
   TOUCH DISTANCE
   ========================================================= */

function getTouchDistance(touch1, touch2) {

    const dx =
        touch1.clientX - touch2.clientX;

    const dy =
        touch1.clientY - touch2.clientY;

    return Math.sqrt(
        dx * dx + dy * dy
    );

}


/* =========================================================
   TOUCH START
   ========================================================= */

scene.addEventListener(
    "touchstart",
    function (event) {

        if (event.touches.length === 2) {

            event.preventDefault();


            pinchActive = true;


            initialPinchDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            const model =
                getActiveModel();


            if (model) {

                initialScale =
                    model.object3D.scale.x;

            }

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

scene.addEventListener(
    "touchmove",
    function (event) {

        if (
            event.touches.length === 2 &&
            pinchActive
        ) {

            event.preventDefault();


            const model =
                getActiveModel();


            if (!model) return;


            const currentDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            if (initialPinchDistance <= 0) {
                return;
            }


            const ratio =
                currentDistance /
                initialPinchDistance;


            /*
                Start from the model's
                current scale.

                Allows both shrinking
                and enlarging.
            */

            let newScale =
                initialScale * ratio;


            /*
                Prevent the object from becoming
                impossibly small or huge.
            */

            newScale =
                Math.max(
                    0.3,
                    Math.min(
                        15.0,
                        newScale
                    )
                );


            model.object3D.scale.set(
                newScale,
                newScale,
                newScale
            );

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
   ========================================================= */

scene.addEventListener(
    "touchend",
    function (event) {

        if (event.touches.length < 2) {

            pinchActive = false;

        }

    }
);


/* =========================================================
   PREVENT PAGE SCROLLING
   ========================================================= */

document.addEventListener(
    "touchmove",
    function (event) {

        if (event.touches.length > 0) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);

</script>


</body>
</html>
