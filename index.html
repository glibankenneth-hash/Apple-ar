<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Apple AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: transparent;
}

a-scene,
canvas {
    width: 100%;
    height: 100%;
    touch-action: none;
}
</style>
</head>

<body>

<a-scene
    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        filterMinCF: 0.0001;
        filterBeta: 0.01;
    "
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
        <a-asset-item
            id="appleModel"
            src="./Apple.glb">
        </a-asset-item>
    </a-assets>

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity
        id="imageTarget"
        mindar-image-target="targetIndex: 0">

        <a-entity id="appleContainer">

            <a-gltf-model
                id="apple"
                src="#appleModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1">
            </a-gltf-model>

        </a-entity>

    </a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const scene = document.querySelector("a-scene");
    const target = document.querySelector("#imageTarget");
    const appleContainer = document.querySelector("#appleContainer");

    const THREE = AFRAME.THREE;

    /* =========================================================
       AR TARGET ORIENTATION
       ========================================================= */

    let currentMode = "vertical";
    let pendingMode = "vertical";
    let modeConfirmFrames = 0;

    const FLOOR_CORRECTION =
        new THREE.Quaternion().setFromEuler(
            new THREE.Euler(
                -Math.PI / 2,
                0,
                0,
                "XYZ"
            )
        );

    const worldUp =
        new THREE.Vector3(0, 1, 0);

    const targetNormal =
        new THREE.Vector3(0, 0, 1);

    const worldNormal =
        new THREE.Vector3();

    const targetWorldQuaternion =
        new THREE.Quaternion();

    function updateTargetMode() {

        if (!target.object3D) {
            return;
        }

        target.object3D.getWorldQuaternion(
            targetWorldQuaternion
        );

        worldNormal
            .copy(targetNormal)
            .applyQuaternion(targetWorldQuaternion)
            .normalize();

        const verticalDot =
            Math.abs(
                worldNormal.dot(worldUp)
            );

        let detectedMode;

        if (verticalDot > 0.55) {
            detectedMode = "floor";
        }
        else if (verticalDot < 0.25) {
            detectedMode = "vertical";
        }
        else {
            detectedMode = currentMode;
        }

        if (detectedMode !== pendingMode) {

            pendingMode = detectedMode;
            modeConfirmFrames = 0;

        }
        else {

            modeConfirmFrames++;

            if (
                modeConfirmFrames >= 12 &&
                currentMode !== pendingMode
            ) {

                currentMode = pendingMode;
            }
        }
    }


    /* =========================================================
       USER ROTATION

       IMPORTANT:

       This version does NOT use the previous trackball
       quaternion cross-product method.

       Instead, finger movement is converted directly into
       screen-space rotation.

       Finger RIGHT  = object rotates RIGHT
       Finger LEFT   = object rotates LEFT
       Finger UP     = object rotates UP
       Finger DOWN   = object rotates DOWN

       Horizontal and vertical movement can be combined,
       allowing diagonal / arbitrary 3D rotation.
       ========================================================= */

    const userQuaternion =
        new THREE.Quaternion();

    const rotationCenter =
        new THREE.Vector2();

    let activeRotationPointer = null;
    let isRotating = false;

    /*
       Rotation sensitivity.

       Increase these if rotation feels too slow.
       Decrease them if rotation feels too fast.
    */

    const ROTATION_SPEED_X = 0.008;
    const ROTATION_SPEED_Y = 0.008;


    /*
       World axes.

       Horizontal finger movement rotates around WORLD Y.

       Vertical finger movement rotates around WORLD X.
    */

    const WORLD_Y =
        new THREE.Vector3(0, 1, 0);

    const WORLD_X =
        new THREE.Vector3(1, 0, 0);


    function rotateFromFingerMovement(
        deltaX,
        deltaY
    ) {

        if (
            Math.abs(deltaX) < 0.001 &&
            Math.abs(deltaY) < 0.001
        ) {
            return;
        }

        /*
        ---------------------------------------------------------
        HORIZONTAL

        Finger RIGHT  -> deltaX positive
        Finger LEFT   -> deltaX negative

        The NEGATIVE sign is intentional.

        In A-Frame's camera coordinate system, this makes the
        visible object follow the finger instead of moving
        visually opposite to it.
        ---------------------------------------------------------
        */

        const horizontalAngle =
            -deltaX * ROTATION_SPEED_X;


        /*
        ---------------------------------------------------------
        VERTICAL

        Finger UP   -> deltaY negative
        Finger DOWN -> deltaY positive

        Therefore:

        UP   -> positive rotation
        DOWN -> negative rotation

        This makes the object visually follow the finger.
        ---------------------------------------------------------
        */

        const verticalAngle =
            -deltaY * ROTATION_SPEED_Y;


        /*
        Create horizontal rotation.
        */

        const horizontalQuaternion =
            new THREE.Quaternion();

        horizontalQuaternion.setFromAxisAngle(
            WORLD_Y,
            horizontalAngle
        );


        /*
        Create vertical rotation.
        */

        const verticalQuaternion =
            new THREE.Quaternion();

        verticalQuaternion.setFromAxisAngle(
            WORLD_X,
            verticalAngle
        );


        /*
        Apply the rotations in SCREEN/WORLD space.

        Horizontal and vertical movement are both preserved,
        so diagonal movement produces combined 3D rotation.
        */

        userQuaternion.premultiply(
            horizontalQuaternion
        );

        userQuaternion.premultiply(
            verticalQuaternion
        );

        userQuaternion.normalize();

        applyAppleRotation();
    }


    /* =========================================================
       APPLY USER ROTATION + FLOOR CORRECTION
       ========================================================= */

    function applyAppleRotation() {

        const finalQuaternion =
            userQuaternion.clone();

        /*
        The Apple must remain upright when the target image
        is lying flat on the floor.

        This correction is separate from user rotation.
        */

        if (currentMode === "floor") {

            finalQuaternion.multiply(
                FLOOR_CORRECTION
            );
        }

        appleContainer.object3D.quaternion.copy(
            finalQuaternion
        );
    }


    /* =========================================================
       PINCH SCALE
       ========================================================= */

    const pointers =
        new Map();

    let initialPinchDistance = null;
    let initialPinchScale = 1;


    function getPinchDistance() {

        if (pointers.size !== 2) {
            return null;
        }

        const values =
            Array.from(
                pointers.values()
            );

        const a = values[0];
        const b = values[1];

        const dx = a.x - b.x;
        const dy = a.y - b.y;

        return Math.sqrt(
            dx * dx + dy * dy
        );
    }


    function updatePinch() {

        if (pointers.size !== 2) {

            initialPinchDistance = null;

            return;
        }

        const distance =
            getPinchDistance();

        if (
            distance === null ||
            distance <= 0
        ) {
            return;
        }

        if (
            initialPinchDistance === null
        ) {

            initialPinchDistance =
                distance;

            initialPinchScale =
                appleContainer.object3D.scale.x;

            return;
        }

        let newScale =
            initialPinchScale *
            (
                distance /
                initialPinchDistance
            );

        newScale =
            THREE.MathUtils.clamp(
                newScale,
                0.3,
                3.0
            );

        appleContainer.object3D.scale.set(
            newScale,
            newScale,
            newScale
        );
    }


    /* =========================================================
       POINTER DOWN
       ========================================================= */

    function onPointerDown(event) {

        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );

        /*
        Start rotation only with one finger.
        */

        if (pointers.size === 1) {

            activeRotationPointer =
                event.pointerId;

            rotationCenter.set(
                event.clientX,
                event.clientY
            );

            isRotating = true;
        }
        else {

            /*
            Two fingers = pinch mode.
            */

            isRotating = false;

            initialPinchDistance = null;
        }

        try {
            event.target.setPointerCapture(
                event.pointerId
            );
        }
        catch (e) {}

        event.preventDefault();
    }


    /* =========================================================
       POINTER MOVE
       ========================================================= */

    function onPointerMove(event) {

        if (
            !pointers.has(
                event.pointerId
            )
        ) {
            return;
        }

        const previousX =
            pointers.get(
                event.pointerId
            ).x;

        const previousY =
            pointers.get(
                event.pointerId
            ).y;

        const deltaX =
            event.clientX - previousX;

        const deltaY =
            event.clientY - previousY;


        /*
        Update pointer position.
        */

        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        /*
        ---------------------------------------------------------
        ONE FINGER = ROTATION
        ---------------------------------------------------------
        */

        if (
            pointers.size === 1 &&
            isRotating &&
            activeRotationPointer ===
            event.pointerId
        ) {

            rotateFromFingerMovement(
                deltaX,
                deltaY
            );
        }


        /*
        ---------------------------------------------------------
        TWO FINGERS = PINCH
        ---------------------------------------------------------
        */

        if (pointers.size === 2) {

            isRotating = false;

            updatePinch();
        }

        event.preventDefault();
    }


    /* =========================================================
       POINTER UP
       ========================================================= */

    function onPointerUp(event) {

        pointers.delete(
            event.pointerId
        );

        if (
            activeRotationPointer ===
            event.pointerId
        ) {

            activeRotationPointer = null;
            isRotating = false;
        }

        if (pointers.size < 2) {

            initialPinchDistance = null;
        }

        event.preventDefault();
    }


    /* =========================================================
       POINTER CANCEL
       ========================================================= */

    function onPointerCancel(event) {

        pointers.delete(
            event.pointerId
        );

        if (
            activeRotationPointer ===
            event.pointerId
        ) {

            activeRotationPointer = null;
            isRotating = false;
        }

        if (pointers.size < 2) {

            initialPinchDistance = null;
        }
    }


    /* =========================================================
       SETUP POINTER EVENTS
       ========================================================= */

    function setupPointerEvents() {

        const canvas =
            scene.canvas ||
            document.querySelector(
                "canvas"
            );

        if (!canvas) {

            requestAnimationFrame(
                setupPointerEvents
            );

            return;
        }

        canvas.style.touchAction =
            "none";

        canvas.addEventListener(
            "pointerdown",
            onPointerDown,
            {
                passive: false
            }
        );

        canvas.addEventListener(
            "pointermove",
            onPointerMove,
            {
                passive: false
            }
        );

        canvas.addEventListener(
            "pointerup",
            onPointerUp,
            {
                passive: false
            }
        );

        canvas.addEventListener(
            "pointercancel",
            onPointerCancel,
            {
                passive: false
            }
        );

        canvas.addEventListener(
            "contextmenu",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );
    }


    /* =========================================================
       AR UPDATE LOOP
       ========================================================= */

    function updateAR() {

        if (
            target.object3D &&
            target.object3D.visible
        ) {

            updateTargetMode();

            /*
            IMPORTANT:

            Do NOT recreate or reset the user's rotation here.

            MindAR only determines whether the target is vertical
            or lying on the floor.

            The user's rotation remains completely independent.
            */

            applyAppleRotation();
        }

        requestAnimationFrame(
            updateAR
        );
    }


    /* =========================================================
       START
       ========================================================= */

    scene.addEventListener(
        "loaded",
        () => {

            setupPointerEvents();

        }
    );

    requestAnimationFrame(
        updateAR
    );

});

</script>

</body>
</html>
