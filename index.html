<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Apple AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: transparent;
}

a-scene {
    width: 100%;
    height: 100%;
    touch-action: none;
}

canvas {
    touch-action: none !important;
}
</style>
</head>

<body>

<a-scene
    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        filterMinCF: 0.0001;
        filterBeta: 0.01;
    "
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
>

    <a-assets>

        <a-asset-item
            id="appleModel"
            src="./Apple.glb">
        </a-asset-item>

    </a-assets>


    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>


    <a-entity
        id="imageTarget"
        mindar-image-target="targetIndex: 0"
    >

        <a-entity id="appleContainer">

            <a-gltf-model
                id="apple"
                src="#appleModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
            >
            </a-gltf-model>

        </a-entity>

    </a-entity>

</a-scene>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const scene =
        document.querySelector("a-scene");

    const target =
        document.querySelector("#imageTarget");

    const appleContainer =
        document.querySelector("#appleContainer");

    const THREE =
        AFRAME.THREE;


    /* =========================================================
       TARGET ORIENTATION
       ========================================================= */

    let currentMode = "vertical";

    let pendingMode = "vertical";

    let modeConfirmFrames = 0;


    const FLOOR_CORRECTION =
        new THREE.Quaternion().setFromEuler(
            new THREE.Euler(
                -Math.PI / 2,
                0,
                0,
                "XYZ"
            )
        );


    const worldUp =
        new THREE.Vector3(
            0,
            1,
            0
        );


    const targetNormal =
        new THREE.Vector3(
            0,
            0,
            1
        );


    const worldNormal =
        new THREE.Vector3();


    const targetQuaternion =
        new THREE.Quaternion();


    function updateTargetMode() {

        if (!target.object3D) {
            return;
        }


        target.object3D.getWorldQuaternion(
            targetQuaternion
        );


        worldNormal
            .copy(targetNormal)
            .applyQuaternion(targetQuaternion)
            .normalize();


        const verticalDot =
            Math.abs(
                worldNormal.dot(worldUp)
            );


        let detectedMode;


        if (verticalDot > 0.55) {

            detectedMode = "floor";

        }
        else if (verticalDot < 0.25) {

            detectedMode = "vertical";

        }
        else {

            detectedMode = currentMode;

        }


        if (detectedMode !== pendingMode) {

            pendingMode =
                detectedMode;

            modeConfirmFrames = 0;

        }
        else {

            modeConfirmFrames++;

            if (
                modeConfirmFrames >= 12 &&
                currentMode !== pendingMode
            ) {

                currentMode =
                    pendingMode;

            }
        }
    }


    /* =========================================================
       USER ROTATION
       =========================================================

       IMPORTANT:

       We do NOT use a trackball here.

       The Apple is rotated directly according to the
       direction the finger moves on the screen.

       RIGHT  = positive Y rotation
       LEFT   = negative Y rotation

       UP     = negative X rotation
       DOWN   = positive X rotation

       This is intentionally camera/screen-style manipulation.
       ========================================================= */


    const userQuaternion =
        new THREE.Quaternion();


    const rotationX =
        new THREE.Quaternion();


    const rotationY =
        new THREE.Quaternion();


    const AXIS_X =
        new THREE.Vector3(
            1,
            0,
            0
        );


    const AXIS_Y =
        new THREE.Vector3(
            0,
            1,
            0
        );


    /*
       Rotation sensitivity.

       Change ONLY these if you want the rotation
       faster or slower.
    */

    const ROTATION_SPEED =
        0.010;


    function rotateApple(
        deltaX,
        deltaY
    ) {

        /*
        Ignore microscopic movement.
        */

        if (
            Math.abs(deltaX) < 0.001 &&
            Math.abs(deltaY) < 0.001
        ) {
            return;
        }


        /* -----------------------------------------------------
           HORIZONTAL

           Finger RIGHT:
               deltaX > 0

           Apple RIGHT:
               positive Y rotation

           Finger LEFT:
               deltaX < 0

           Apple LEFT:
               negative Y rotation
           ----------------------------------------------------- */

        const yaw =
            deltaX * ROTATION_SPEED;


        rotationY.setFromAxisAngle(
            AXIS_Y,
            yaw
        );


        /* -----------------------------------------------------
           VERTICAL

           Browser screen coordinates:

               UP   = negative deltaY
               DOWN = positive deltaY

           We therefore use deltaY directly with X rotation
           so the Apple follows the finger direction.
           ----------------------------------------------------- */

        const pitch =
            deltaY * ROTATION_SPEED;


        rotationX.setFromAxisAngle(
            AXIS_X,
            pitch
        );


        /*
        Apply both rotations.

        Horizontal and vertical movement are independent,
        so diagonal movement produces combined 3D rotation.
        */

        userQuaternion.premultiply(
            rotationY
        );


        userQuaternion.premultiply(
            rotationX
        );


        userQuaternion.normalize();


        applyAppleRotation();
    }


    /* =========================================================
       APPLY FINAL ROTATION
       ========================================================= */

    function applyAppleRotation() {

        const finalQuaternion =
            userQuaternion.clone();


        /*
        Only the AR target orientation correction is applied
        here.

        User rotation is NEVER overwritten by MindAR.
        */

        if (currentMode === "floor") {

            finalQuaternion.multiply(
                FLOOR_CORRECTION
            );
        }


        appleContainer.object3D.quaternion.copy(
            finalQuaternion
        );
    }


    /* =========================================================
       POINTER STATE
       ========================================================= */

    const pointers =
        new Map();


    let rotationPointerId =
        null;


    let previousX =
        0;


    let previousY =
        0;


    let isRotating =
        false;


    /* =========================================================
       PINCH STATE
       ========================================================= */

    let pinchStartDistance =
        null;


    let pinchStartScale =
        1;


    function getPinchDistance() {

        if (pointers.size !== 2) {
            return null;
        }


        const values =
            Array.from(
                pointers.values()
            );


        const a =
            values[0];


        const b =
            values[1];


        const dx =
            a.x - b.x;


        const dy =
            a.y - b.y;


        return Math.sqrt(
            dx * dx +
            dy * dy
        );
    }


    function updatePinch() {

        const distance =
            getPinchDistance();


        if (distance === null) {

            pinchStartDistance =
                null;

            return;
        }


        if (pinchStartDistance === null) {

            pinchStartDistance =
                distance;


            pinchStartScale =
                appleContainer
                    .object3D
                    .scale
                    .x;


            return;
        }


        if (pinchStartDistance <= 0) {
            return;
        }


        let scale =
            pinchStartScale *
            (
                distance /
                pinchStartDistance
            );


        scale =
            THREE.MathUtils.clamp(
                scale,
                0.3,
                3.0
            );


        appleContainer.object3D.scale.set(
            scale,
            scale,
            scale
        );
    }


    /* =========================================================
       POINTER DOWN
       ========================================================= */

    function pointerDown(event) {

        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        /*
        One finger = rotation.
        */

        if (pointers.size === 1) {

            rotationPointerId =
                event.pointerId;


            previousX =
                event.clientX;


            previousY =
                event.clientY;


            isRotating =
                true;

        }
        else {

            /*
            Two fingers = pinch.

            Stop rotation so the second finger cannot
            accidentally cause a rotation jump.
            */

            isRotating =
                false;


            rotationPointerId =
                null;


            pinchStartDistance =
                null;
        }


        try {

            event.target.setPointerCapture(
                event.pointerId
            );

        }
        catch (error) {}


        event.preventDefault();
    }


    /* =========================================================
       POINTER MOVE
       ========================================================= */

    function pointerMove(event) {

        if (
            !pointers.has(
                event.pointerId
            )
        ) {
            return;
        }


        /*
        Update pointer coordinates.
        */

        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        /* -----------------------------------------------------
           ONE FINGER
           ----------------------------------------------------- */

        if (
            pointers.size === 1 &&
            isRotating &&
            rotationPointerId ===
            event.pointerId
        ) {


            const deltaX =
                event.clientX -
                previousX;


            const deltaY =
                event.clientY -
                previousY;


            /*
            THIS is the important part.

            The exact physical direction of the finger
            is passed directly into rotateApple().
            */

            rotateApple(
                deltaX,
                deltaY
            );


            previousX =
                event.clientX;


            previousY =
                event.clientY;
        }


        /* -----------------------------------------------------
           TWO FINGERS
           ----------------------------------------------------- */

        else if (pointers.size === 2) {

            isRotating =
                false;


            updatePinch();
        }


        event.preventDefault();
    }


    /* =========================================================
       POINTER UP
       ========================================================= */

    function pointerUp(event) {

        pointers.delete(
            event.pointerId
        );


        if (
            rotationPointerId ===
            event.pointerId
        ) {

            rotationPointerId =
                null;


            isRotating =
                false;
        }


        if (pointers.size < 2) {

            pinchStartDistance =
                null;
        }


        event.preventDefault();
    }


    /* =========================================================
       POINTER CANCEL
       ========================================================= */

    function pointerCancel(event) {

        pointers.delete(
            event.pointerId
        );


        if (
            rotationPointerId ===
            event.pointerId
        ) {

            rotationPointerId =
                null;


            isRotating =
                false;
        }


        if (pointers.size < 2) {

            pinchStartDistance =
                null;
        }
    }


    /* =========================================================
       SETUP POINTER EVENTS
       ========================================================= */

    function setupPointerEvents() {

        const canvas =
            scene.canvas ||
            document.querySelector(
                "canvas"
            );


        if (!canvas) {

            requestAnimationFrame(
                setupPointerEvents
            );

            return;
        }


        canvas.style.touchAction =
            "none";


        canvas.addEventListener(
            "pointerdown",
            pointerDown,
            {
                passive: false
            }
        );


        canvas.addEventListener(
            "pointermove",
            pointerMove,
            {
                passive: false
            }
        );


        canvas.addEventListener(
            "pointerup",
            pointerUp,
            {
                passive: false
            }
        );


        canvas.addEventListener(
            "pointercancel",
            pointerCancel,
            {
                passive: false
            }
        );


        canvas.addEventListener(
            "contextmenu",
            function (event) {

                event.preventDefault();

            },
            {
                passive: false
            }
        );
    }


    /* =========================================================
       AR LOOP
       ========================================================= */

    function updateAR() {

        if (
            target.object3D &&
            target.object3D.visible
        ) {

            updateTargetMode();


            /*
            Reapply the user's existing rotation.

            We NEVER reset userQuaternion here.
            */

            applyAppleRotation();
        }


        requestAnimationFrame(
            updateAR
        );
    }


    /* =========================================================
       START
       ========================================================= */

    scene.addEventListener(
        "loaded",
        function () {

            setupPointerEvents();

        }
    );


    requestAnimationFrame(
        updateAR
    );

});

</script>

</body>
</html>
