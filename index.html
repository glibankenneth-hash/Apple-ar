<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Apple AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: none;
}

a-scene {
    width: 100%;
    height: 100%;
}

</style>

</head>

<body>

<a-scene
    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        filterMinCF: 0.0001;
        filterBeta: 0.01;
    "
    color-space="sRGB"
    renderer="
        colorManagement: true;
        antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>

        <a-asset-item
            id="appleModel"
            src="./Apple.glb">
        </a-asset-item>

    </a-assets>

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity
        id="imageTarget"
        mindar-image-target="targetIndex: 0">

        <a-entity id="appleContainer">

            <a-gltf-model
                id="apple"
                src="#appleModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1">
            </a-gltf-model>

        </a-entity>

    </a-entity>

</a-scene>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const scene =
    document.querySelector("a-scene");

const target =
    document.querySelector("#imageTarget");

const appleContainer =
    document.querySelector("#appleContainer");


/* =========================================================
   SETTINGS
========================================================= */

const MIN_SCALE = 0.3;
const MAX_SCALE = 3.0;


/*
    Higher value = faster 3D rotation.
*/

const ROTATION_SPEED = 1.8;


/* =========================================================
   TARGET ORIENTATION
========================================================= */

let currentMode = "vertical";

let candidateMode = "vertical";

let candidateFrames = 0;

const ORIENTATION_CONFIRM_FRAMES = 12;

const VERTICAL_THRESHOLD = 0.55;

const FLOOR_THRESHOLD = 0.25;


/* =========================================================
   THREE.JS OBJECTS
========================================================= */

const targetQuaternion =
    new THREE.Quaternion();

const targetNormal =
    new THREE.Vector3(0, 0, 1);

const worldUp =
    new THREE.Vector3(0, 1, 0);

const rotatedNormal =
    new THREE.Vector3();


/*
    User's complete 3D rotation.
*/

const userQuaternion =
    new THREE.Quaternion();


/*
    Final rotation applied to Apple.
*/

const finalQuaternion =
    new THREE.Quaternion();


/*
    Floor correction.
*/

const floorQuaternion =
    new THREE.Quaternion();


floorQuaternion.setFromAxisAngle(
    new THREE.Vector3(1, 0, 0),
    THREE.MathUtils.degToRad(-90)
);


/* =========================================================
   SCALE
========================================================= */

let currentScale = 1;

let initialScale = 1;

let initialPinchDistance = null;


/* =========================================================
   POINTER TRACKING
========================================================= */

/*
    Pointer events are used instead of separate mouse/touch
    rotation systems.

    This makes the exact same 3D trackball work on:

    - phone
    - tablet
    - mouse
    - touchscreen PC
*/

const pointers = new Map();

let activeRotationPointer = null;

let previousTrackballVector = null;


/* =========================================================
   TRACKBALL VECTOR
========================================================= */

function getTrackballVector(clientX, clientY) {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    /*
        Convert screen coordinates to:

        X = -1 ... +1
        Y = -1 ... +1
    */

    let x =
        (clientX / width) * 2 - 1;

    let y =
        1 - (clientY / height) * 2;


    /*
        Keep the trackball proportional.
    */

    const size =
        Math.min(width, height);


    x =
        x * width / size;


    y =
        y * height / size;


    /*
        Virtual sphere radius.
    */

    const radius = 1;


    const lengthSquared =
        x * x +
        y * y;


    let z;


    if (lengthSquared <= radius * radius) {

        z =
            Math.sqrt(
                radius * radius -
                lengthSquared
            );

    } else {

        /*
            Outside the sphere, project onto
            the edge instead of allowing unstable
            values.
        */

        const length =
            Math.sqrt(lengthSquared);

        x /= length;
        y /= length;
        z = 0;

    }


    return new THREE.Vector3(
        x,
        y,
        z
    ).normalize();

}


/* =========================================================
   TRACKBALL ROTATION
========================================================= */

function rotateTrackball(
    previousVector,
    currentVector
) {

    /*
        Calculate rotation axis.

        Cross product gives the axis perpendicular
        to the two finger positions on the sphere.
    */

    const rotationAxis =
        new THREE.Vector3()
            .crossVectors(
                previousVector,
                currentVector
            );


    const axisLength =
        rotationAxis.length();


    /*
        Almost no movement.
    */

    if (axisLength < 0.00001) {

        return;

    }


    rotationAxis.normalize();


    /*
        Calculate angle between the two vectors.
    */

    let dot =
        previousVector.dot(
            currentVector
        );


    dot =
        THREE.MathUtils.clamp(
            dot,
            -1,
            1
        );


    let angle =
        Math.acos(dot);


    angle *= ROTATION_SPEED;


    /*
        Create quaternion representing
        this drag movement.
    */

    const deltaQuaternion =
        new THREE.Quaternion();


    deltaQuaternion.setFromAxisAngle(
        rotationAxis,
        angle
    );


    /*
        Add this rotation to the existing
        Apple rotation.

        This is the important part:

        We are NOT only rotating Y anymore.

        The Apple can rotate around ANY
        direction indicated by the drag.
    */

    userQuaternion.premultiply(
        deltaQuaternion
    );


    userQuaternion.normalize();


    applyAppleRotation();

}


/* =========================================================
   APPLY APPLE ROTATION
========================================================= */

function applyAppleRotation() {

    /*
        Start with the user's free 3D rotation.
    */

    finalQuaternion.copy(
        userQuaternion
    );


    /*
        If the target is lying on the floor,
        apply the required target-plane correction.

        This does NOT use accelerometer data.
    */

    if (currentMode === "floor") {

        finalQuaternion.multiply(
            floorQuaternion
        );

    }


    appleContainer.object3D.quaternion.copy(
        finalQuaternion
    );


    /*
        Preserve scale.
    */

    appleContainer.object3D.scale.set(
        currentScale,
        currentScale,
        currentScale
    );

}


/* =========================================================
   DETECT TARGET ORIENTATION
========================================================= */

function detectTargetMode() {

    if (!target.object3D) {

        return currentMode;

    }


    targetQuaternion.copy(
        target.object3D.quaternion
    );


    /*
        MindAR target local normal.
    */

    targetNormal.set(
        0,
        0,
        1
    );


    rotatedNormal
        .copy(targetNormal)
        .applyQuaternion(
            targetQuaternion
        )
        .normalize();


    /*
        Determine how close the target normal
        is to world-up.

        High value = floor.

        Low value = vertical.
    */

    const verticalAmount =
        Math.abs(
            rotatedNormal.dot(worldUp)
        );


    if (
        verticalAmount >
        VERTICAL_THRESHOLD
    ) {

        return "floor";

    }


    if (
        verticalAmount <
        FLOOR_THRESHOLD
    ) {

        return "vertical";

    }


    return currentMode;

}


/* =========================================================
   STABLE TARGET MODE
========================================================= */

function updateTargetMode() {

    const detectedMode =
        detectTargetMode();


    if (
        detectedMode ===
        currentMode
    ) {

        candidateMode =
            currentMode;

        candidateFrames = 0;

        return;

    }


    if (
        detectedMode !==
        candidateMode
    ) {

        candidateMode =
            detectedMode;

        candidateFrames = 1;

        return;

    }


    candidateFrames++;


    if (
        candidateFrames >=
        ORIENTATION_CONFIRM_FRAMES
    ) {

        currentMode =
            candidateMode;

        candidateFrames = 0;

        applyAppleRotation();

    }

}


/* =========================================================
   POINTER DOWN
========================================================= */

document.addEventListener(
    "pointerdown",
    function(event) {

        /*
            Only primary mouse button.
        */

        if (
            event.pointerType === "mouse" &&
            event.button !== 0
        ) {

            return;

        }


        pointers.set(
            event.pointerId,
            event
        );


        /*
            One pointer = rotation.
        */

        if (
            pointers.size === 1
        ) {

            activeRotationPointer =
                event.pointerId;


            previousTrackballVector =
                getTrackballVector(
                    event.clientX,
                    event.clientY
                );


            try {

                event.target.setPointerCapture(
                    event.pointerId
                );

            } catch (error) {}

        }


        /*
            Two pointers = pinch.
        */

        if (
            pointers.size === 2
        ) {

            activeRotationPointer =
                null;

            previousTrackballVector =
                null;


            const values =
                Array.from(
                    pointers.values()
                );


            initialPinchDistance =
                getDistance(
                    values[0],
                    values[1]
                );


            initialScale =
                currentScale;

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

document.addEventListener(
    "pointermove",
    function(event) {

        if (
            !pointers.has(
                event.pointerId
            )
        ) {

            return;

        }


        pointers.set(
            event.pointerId,
            event
        );


        /*
            TWO POINTERS = PINCH
        */

        if (
            pointers.size === 2
        ) {

            event.preventDefault();


            const values =
                Array.from(
                    pointers.values()
                );


            const distance =
                getDistance(
                    values[0],
                    values[1]
                );


            if (
                initialPinchDistance ===
                null
            ) {

                initialPinchDistance =
                    distance;

                initialScale =
                    currentScale;

                return;

            }


            const scaleFactor =
                distance /
                initialPinchDistance;


            let newScale =
                initialScale *
                scaleFactor;


            newScale =
                THREE.MathUtils.clamp(
                    newScale,
                    MIN_SCALE,
                    MAX_SCALE
                );


            currentScale =
                newScale;


            appleContainer.object3D.scale.set(
                newScale,
                newScale,
                newScale
            );


            return;

        }


        /*
            ONE POINTER = FREE ROTATION
        */

        if (
            pointers.size === 1 &&
            event.pointerId ===
            activeRotationPointer
        ) {

            event.preventDefault();


            const currentVector =
                getTrackballVector(
                    event.clientX,
                    event.clientY
                );


            if (
                previousTrackballVector
            ) {

                rotateTrackball(
                    previousTrackballVector,
                    currentVector
                );

            }


            previousTrackballVector =
                currentVector;

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   POINTER UP
========================================================= */

function endPointer(event) {

    pointers.delete(
        event.pointerId
    );


    /*
        No pointers left.
    */

    if (
        pointers.size === 0
    ) {

        activeRotationPointer =
            null;

        previousTrackballVector =
            null;

        initialPinchDistance =
            null;

    }


    /*
        One pointer remains after pinch.

        Start a fresh rotation from its
        current position.

        This prevents a sudden jump.
    */

    if (
        pointers.size === 1
    ) {

        const remaining =
            Array.from(
                pointers.values()
            )[0];


        activeRotationPointer =
            remaining.pointerId;


        previousTrackballVector =
            getTrackballVector(
                remaining.clientX,
                remaining.clientY
            );


        initialPinchDistance =
            null;

    }

}


document.addEventListener(
    "pointerup",
    endPointer
);


document.addEventListener(
    "pointercancel",
    endPointer
);


/* =========================================================
   PINCH DISTANCE
========================================================= */

function getDistance(
    pointA,
    pointB
) {

    const dx =
        pointA.clientX -
        pointB.clientX;


    const dy =
        pointA.clientY -
        pointB.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   AR UPDATE LOOP
========================================================= */

function updateAR() {

    if (
        target.object3D.visible
    ) {

        updateTargetMode();

    }


    requestAnimationFrame(
        updateAR
    );

}


/* =========================================================
   START
========================================================= */

scene.addEventListener(
    "loaded",
    function() {

        requestAnimationFrame(
            updateAR
        );

    }
);

</script>

</body>
</html>
