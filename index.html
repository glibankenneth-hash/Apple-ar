<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Children's Book</title>


<!-- =========================================================
     A-FRAME
     ========================================================= -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: none;

    background: transparent;
}


a-scene {

    width: 100%;
    height: 100%;

    touch-action: none;
}


canvas {

    touch-action: none !important;
}


.mindar-ui-scanning,
.mindar-ui-loading,
.mindar-ui-error {

    display: none !important;
}

</style>

</head>


<body>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;

        autoStart: true;

        uiScanning: no;
        uiLoading: no;
        uiError: no;

        /*
            FAST TARGET DETECTION
        */
        warmupTolerance: 1;
        missTolerance: 1;

        /*
            FAST BUT STILL STABLE TRACKING
        */
        filterMinCF: 0.001;
        filterBeta: 1000;

        maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
>


<!-- =========================================================
     ASSETS
     ========================================================= -->

<a-assets>

    <a-asset-item
        id="appleModel"
        src="./Apple.glb">
    </a-asset-item>


    <a-asset-item
        id="ballModel"
        src="./Ball.glb">
    </a-asset-item>

</a-assets>


<!-- =========================================================
     CAMERA
     ========================================================= -->

<a-camera
    position="0 0 0"
    look-controls="enabled: false">
</a-camera>


<!-- =========================================================
     PAGE A
     APPLE
     ========================================================= -->

<a-entity
    id="appleTarget"
    mindar-image-target="targetIndex: 0"
>


    <!-- Orientation wrapper -->
    <a-entity id="appleOrientation">


        <!-- Rotation wrapper -->
        <a-entity id="appleRotation">


            <!-- Centering wrapper -->
            <a-entity id="appleCenter">


                <a-gltf-model

                    id="apple"

                    src="#appleModel"

                    position="0 0 0"

                    rotation="0 0 0"

                    scale="1 1 1"

                    visible="false"

                ></a-gltf-model>


            </a-entity>

        </a-entity>

    </a-entity>

</a-entity>


<!-- =========================================================
     PAGE B
     BALL
     ========================================================= -->

<a-entity
    id="ballTarget"
    mindar-image-target="targetIndex: 1"
>


    <!-- Orientation wrapper -->
    <a-entity id="ballOrientation">


        <!-- Rotation wrapper -->
        <a-entity id="ballRotation">


            <!-- Centering wrapper -->
            <a-entity id="ballCenter">


                <a-gltf-model

                    id="ball"

                    src="#ballModel"

                    position="0 0 0"

                    rotation="0 0 0"

                    scale="1 1 1"

                    visible="false"

                ></a-gltf-model>


            </a-entity>

        </a-entity>

    </a-entity>

</a-entity>


</a-scene>



<script>


document.addEventListener("DOMContentLoaded", function () {


    const THREE = AFRAME.THREE;

    const scene = document.querySelector("a-scene");


    /* =========================================================
       TARGETS
       ========================================================= */

    const appleTarget =
        document.querySelector("#appleTarget");

    const ballTarget =
        document.querySelector("#ballTarget");


    /* =========================================================
       MODELS
       ========================================================= */

    const apple =
        document.querySelector("#apple");

    const ball =
        document.querySelector("#ball");


    /* =========================================================
       WRAPPERS
       ========================================================= */

    const appleOrientation =
        document.querySelector("#appleOrientation");

    const appleRotation =
        document.querySelector("#appleRotation");

    const appleCenter =
        document.querySelector("#appleCenter");


    const ballOrientation =
        document.querySelector("#ballOrientation");

    const ballRotation =
        document.querySelector("#ballRotation");

    const ballCenter =
        document.querySelector("#ballCenter");


    /* =========================================================
       REAL WORLD PAGE SIZE
       =========================================================

       CHILDREN'S BOOK PAGE:

       22 cm × 22 cm

       22 cm = 0.22 meter

       MindAR target width = 1 scene unit

       Therefore:

       1 target unit = 22 cm in the real world.
    */

    const PAGE_WIDTH_METERS = 0.22;


    /* =========================================================
       DESIRED REAL WORLD MODEL SIZES
       ========================================================= */

    const APPLE_REAL_SIZE_METERS = 0.076;

    const BALL_REAL_SIZE_METERS = 0.241;


    /* =========================================================
       ROTATION SPEED
       ========================================================= */

    const ROTATION_SPEED = 0.010;


    /* =========================================================
       TRACKING STATE
       ========================================================= */

    let activeTarget = -1;


    let appleTracked = false;
    let ballTracked = false;


    /* =========================================================
       STABLE TRACKING
       ========================================================= */

    const REQUIRED_STABLE_FRAMES = 2;


    let appleStableFrames = 0;
    let ballStableFrames = 0;


    let appleStableTracking = false;
    let ballStableTracking = false;


    let applePoseLocked = true;
    let ballPoseLocked = true;


    /* =========================================================
       ORIENTATION MODES
       ========================================================= */

    let appleCurrentMode = "vertical";
    let applePendingMode = "vertical";
    let appleModeConfirmFrames = 0;


    let ballCurrentMode = "vertical";
    let ballPendingMode = "vertical";
    let ballModeConfirmFrames = 0;


    const MODE_CONFIRM_FRAMES = 5;


    /* =========================================================
       FLOOR ROTATION
       ========================================================= */

    const FLOOR_CORRECTION =
        new THREE.Quaternion().setFromEuler(

            new THREE.Euler(

                -Math.PI / 2,
                0,
                0,
                "XYZ"

            )

        );


    /* =========================================================
       DIRECTION VECTORS
       ========================================================= */

    const worldUp =
        new THREE.Vector3(0, 1, 0);


    const targetNormal =
        new THREE.Vector3(0, 0, 1);


    const worldNormal =
        new THREE.Vector3();


    const targetQuaternion =
        new THREE.Quaternion();



    /* =========================================================
       USER ROTATION
       ========================================================= */

    let appleRotationX = 0;
    let appleRotationY = 0;


    let ballRotationX = 0;
    let ballRotationY = 0;



    function applyAppleRotation() {

        appleRotation.object3D.rotation.x =
            appleRotationX;

        appleRotation.object3D.rotation.y =
            appleRotationY;

        appleRotation.object3D.rotation.z = 0;

    }



    function applyBallRotation() {

        ballRotation.object3D.rotation.x =
            ballRotationX;

        ballRotation.object3D.rotation.y =
            ballRotationY;

        ballRotation.object3D.rotation.z = 0;

    }



    function rotateApple(deltaX, deltaY) {

        appleRotationY +=
            deltaX * ROTATION_SPEED;


        appleRotationX +=
            deltaY * ROTATION_SPEED;


        appleRotationX =
            THREE.MathUtils.euclideanModulo(

                appleRotationX + Math.PI,

                Math.PI * 2

            ) - Math.PI;


        appleRotationY =
            THREE.MathUtils.euclideanModulo(

                appleRotationY + Math.PI,

                Math.PI * 2

            ) - Math.PI;


        applyAppleRotation();

    }



    function rotateBall(deltaX, deltaY) {

        ballRotationY +=
            deltaX * ROTATION_SPEED;


        ballRotationX +=
            deltaY * ROTATION_SPEED;


        ballRotationX =
            THREE.MathUtils.euclideanModulo(

                ballRotationX + Math.PI,

                Math.PI * 2

            ) - Math.PI;


        ballRotationY =
            THREE.MathUtils.euclideanModulo(

                ballRotationY + Math.PI,

                Math.PI * 2

            ) - Math.PI;


        applyBallRotation();

    }



    /* =========================================================
       MODEL SIZE CALIBRATION
       =========================================================

       This is important.

       The target image is 22 cm wide.

       MindAR treats the target width as 1 scene unit.

       Therefore:

       7.6 cm Apple
       =
       0.076 / 0.22
       =
       0.34545 target units


       24.1 cm Ball
       =
       0.241 / 0.22
       =
       1.09545 target units


       We then measure the actual imported GLB and
       automatically calculate its required scale.

       This avoids assuming that the GLB was exported
       at exactly 1 scene unit.
    */


    function calibrateModel(

        modelElement,
        desiredMeters

    ) {

        if (!modelElement.object3D) return;


        const model =
            modelElement.object3D;


        /* Reset scale first */

        model.scale.set(1, 1, 1);


        model.updateMatrixWorld(true);


        const box =
            new THREE.Box3();


        box.setFromObject(model);


        const size =
            new THREE.Vector3();


        box.getSize(size);


        const nativeSize =
            Math.max(

                size.x,
                size.y,
                size.z

            );


        if (

            !isFinite(nativeSize) ||
            nativeSize <= 0

        ) {

            console.warn(
                "Could not determine model size."
            );

            return;

        }


        /*
            Desired size in MindAR target units.
        */

        const desiredTargetSize =
            desiredMeters /
            PAGE_WIDTH_METERS;


        /*
            Required GLB scale.
        */

        const finalScale =
            desiredTargetSize /
            nativeSize;


        model.scale.set(

            finalScale,
            finalScale,
            finalScale

        );


        model.updateMatrixWorld(true);


        console.log(
            "Model calibrated:",
            desiredMeters * 100,
            "cm",
            "Native size:",
            nativeSize,
            "Target size:",
            desiredTargetSize,
            "Final scale:",
            finalScale
        );

    }



    /* =========================================================
       CENTER MODEL
       =========================================================

       This keeps rotation around the visual center
       instead of the GLB's original origin.
    */

    function centerModel(modelElement, centerElement) {

        const model =
            modelElement.object3D;


        model.updateMatrixWorld(true);


        const box =
            new THREE.Box3();


        box.setFromObject(model);


        const center =
            new THREE.Vector3();


        box.getCenter(center);


        /*
            Move the model so its visual center
            is at the wrapper origin.
        */

        model.position.x -= center.x;

        model.position.y -= center.y;

        model.position.z -= center.z;


        model.updateMatrixWorld(true);

    }



    /* =========================================================
       PREPARE APPLE
       ========================================================= */

    apple.addEventListener(

        "model-loaded",

        function () {

            calibrateModel(

                apple,
                APPLE_REAL_SIZE_METERS

            );


            centerModel(

                apple,
                appleCenter

            );


            apple.setAttribute(
                "visible",
                false
            );

        }

    );



    /* =========================================================
       PREPARE BALL
       ========================================================= */

    ball.addEventListener(

        "model-loaded",

        function () {

            calibrateModel(

                ball,
                BALL_REAL_SIZE_METERS

            );


            centerModel(

                ball,
                ballCenter

            );


            ball.setAttribute(
                "visible",
                false
            );

        }

    );



    /* =========================================================
       PINCH / TOUCH
       ========================================================= */

    const pointers = new Map();


    let rotationPointerId = null;


    let previousX = 0;
    let previousY = 0;


    let isRotating = false;


    let pinchStartDistance = null;

    let pinchStartScale = 1;

    let pinchObject = null;



    function getPinchDistance() {

        if (pointers.size !== 2) {

            return null;

        }


        const values =
            Array.from(
                pointers.values()
            );


        const a = values[0];
        const b = values[1];


        const dx =
            a.x - b.x;


        const dy =
            a.y - b.y;


        return Math.sqrt(

            dx * dx +
            dy * dy

        );

    }



    function resetPointerState() {

        pointers.clear();

        rotationPointerId = null;

        isRotating = false;

        pinchStartDistance = null;

        pinchObject = null;

    }



    function updatePinch() {

        const distance =
            getPinchDistance();


        if (distance === null) {

            pinchStartDistance = null;

            pinchObject = null;

            return;

        }


        let object = null;


        if (activeTarget === 0) {

            object = apple;

        }

        else if (activeTarget === 1) {

            object = ball;

        }


        if (!object) return;



        if (pinchStartDistance === null) {

            pinchStartDistance = distance;

            pinchStartScale =
                object.object3D.scale.x;

            pinchObject = object;

            return;

        }


        let scale =

            pinchStartScale *
            (distance / pinchStartDistance);


        const minimum =
            pinchStartScale * 0.25;


        const maximum =
            pinchStartScale * 4.0;


        scale =
            THREE.MathUtils.clamp(

                scale,
                minimum,
                maximum

            );


        object.object3D.scale.set(

            scale,
            scale,
            scale

        );

    }



    function pointerDown(event) {

        if (activeTarget === -1) return;


        pointers.set(

            event.pointerId,

            {

                x: event.clientX,
                y: event.clientY

            }

        );


        if (pointers.size === 1) {

            rotationPointerId =
                event.pointerId;


            previousX =
                event.clientX;


            previousY =
                event.clientY;


            isRotating = true;

        }

        else {

            isRotating = false;

            rotationPointerId = null;

            pinchStartDistance = null;

        }


        try {

            event.target.setPointerCapture(

                event.pointerId

            );

        }

        catch (error) {}


        event.preventDefault();

    }



    function pointerMove(event) {

        if (activeTarget === -1)
            return;


        if (!pointers.has(event.pointerId))
            return;


        pointers.set(

            event.pointerId,

            {

                x: event.clientX,
                y: event.clientY

            }

        );


        /*
            ONE FINGER = ROTATE
        */

        if (

            pointers.size === 1 &&
            isRotating &&
            rotationPointerId === event.pointerId

        ) {

            const deltaX =
                event.clientX - previousX;


            const deltaY =
                event.clientY - previousY;


            if (activeTarget === 0) {

                rotateApple(
                    deltaX,
                    deltaY
                );

            }

            else if (activeTarget === 1) {

                rotateBall(
                    deltaX,
                    deltaY
                );

            }


            previousX =
                event.clientX;


            previousY =
                event.clientY;

        }


        /*
            TWO FINGERS = SCALE
        */

        else if (pointers.size === 2) {

            isRotating = false;

            updatePinch();

        }


        event.preventDefault();

    }



    function pointerUp(event) {

        pointers.delete(
            event.pointerId
        );


        if (

            rotationPointerId ===
            event.pointerId

        ) {

            rotationPointerId = null;

            isRotating = false;

        }


        if (pointers.size < 2) {

            pinchStartDistance = null;

            pinchObject = null;

        }


        event.preventDefault();

    }



    function pointerCancel(event) {

        pointers.delete(
            event.pointerId
        );


        if (

            rotationPointerId ===
            event.pointerId

        ) {

            rotationPointerId = null;

            isRotating = false;

        }


        if (pointers.size < 2) {

            pinchStartDistance = null;

            pinchObject = null;

        }

    }



    /* =========================================================
       APPLE FLOOR / VERTICAL DETECTION
       ========================================================= */

    function detectAppleMode() {

        if (!appleTracked)
            return null;


        appleTarget.object3D.getWorldQuaternion(

            targetQuaternion

        );


        worldNormal

            .copy(targetNormal)

            .applyQuaternion(
                targetQuaternion
            )

            .normalize();


        const verticalDot =

            Math.abs(

                worldNormal.dot(worldUp)

            );


        if (verticalDot > 0.70)

            return "floor";


        if (verticalDot < 0.20)

            return "vertical";


        return appleCurrentMode;

    }



    /* =========================================================
       BALL FLOOR / VERTICAL DETECTION
       ========================================================= */

    function detectBallMode() {

        if (!ballTracked)
            return null;


        ballTarget.object3D.getWorldQuaternion(

            targetQuaternion

        );


        worldNormal

            .copy(targetNormal)

            .applyQuaternion(
                targetQuaternion
            )

            .normalize();


        const verticalDot =

            Math.abs(

                worldNormal.dot(worldUp)

            );


        if (verticalDot > 0.70)

            return "floor";


        if (verticalDot < 0.20)

            return "vertical";


        return ballCurrentMode;

    }



    /* =========================================================
       APPLE ORIENTATION
       ========================================================= */

    function applyAppleTargetOrientation() {

        if (

            !appleTracked ||
            !appleStableTracking

        ) {

            return;

        }


        if (

            appleCurrentMode === "floor"

        ) {

            appleOrientation
                .object3D
                .quaternion
                .copy(
                    FLOOR_CORRECTION
                );

        }

        else {

            appleOrientation
                .object3D
                .quaternion
                .identity();

        }

    }



    /* =========================================================
       BALL ORIENTATION
       ========================================================= */

    function applyBallTargetOrientation() {

        if (

            !ballTracked ||
            !ballStableTracking

        ) {

            return;

        }


        if (

            ballCurrentMode === "floor"

        ) {

            ballOrientation
                .object3D
                .quaternion
                .copy(
                    FLOOR_CORRECTION
                );

        }

        else {

            ballOrientation
                .object3D
                .quaternion
                .identity();

        }

    }



    /* =========================================================
       UPDATE APPLE MODE
       ========================================================= */

    function updateAppleMode() {

        if (

            !appleTracked ||
            !appleStableTracking

        ) {

            return;

        }


        const detected =
            detectAppleMode();


        if (detected === null)
            return;


        if (

            detected !==
            applePendingMode

        ) {

            applePendingMode =
                detected;


            appleModeConfirmFrames = 0;

            return;

        }


        appleModeConfirmFrames++;


        if (

            appleModeConfirmFrames >=
            MODE_CONFIRM_FRAMES

        ) {

            if (

                appleCurrentMode !==
                applePendingMode

            ) {

                appleCurrentMode =
                    applePendingMode;

            }

        }

    }



    /* =========================================================
       UPDATE BALL MODE
       ========================================================= */

    function updateBallMode() {

        if (

            !ballTracked ||
            !ballStableTracking

        ) {

            return;

        }


        const detected =
            detectBallMode();


        if (detected === null)
            return;


        if (

            detected !==
            ballPendingMode

        ) {

            ballPendingMode =
                detected;


            ballModeConfirmFrames = 0;

            return;

        }


        ballModeConfirmFrames++;


        if (

            ballModeConfirmFrames >=
            MODE_CONFIRM_FRAMES

        ) {

            if (

                ballCurrentMode !==
                ballPendingMode

            ) {

                ballCurrentMode =
                    ballPendingMode;

            }

        }

    }



    /* =========================================================
       APPLE FOUND
       ========================================================= */

    appleTarget.addEventListener(

        "targetFound",

        function () {

            console.log(
                "APPLE TARGET FOUND - Target 0"
            );


            activeTarget = 0;


            appleTracked = true;

            applePoseLocked = true;

            appleStableTracking = false;

            appleStableFrames = 0;


            applePendingMode =
                appleCurrentMode;


            appleModeConfirmFrames = 0;


            /*
                Immediately hide Ball.
            */

            ballTracked = false;

            ballPoseLocked = true;

            ballStableTracking = false;

            ballStableFrames = 0;


            ball.setAttribute(
                "visible",
                false
            );


            /*
                Show Apple.
            */

            apple.setAttribute(
                "visible",
                true
            );


            resetPointerState();

        }

    );



    /* =========================================================
       APPLE LOST
       ========================================================= */

    appleTarget.addEventListener(

        "targetLost",

        function () {

            console.log(
                "APPLE TARGET LOST - Target 0"
            );


            appleTracked = false;

            applePoseLocked = true;

            appleStableTracking = false;

            appleStableFrames = 0;


            apple.setAttribute(
                "visible",
                false
            );


            if (activeTarget === 0) {

                activeTarget = -1;

                resetPointerState();

            }

        }

    );



    /* =========================================================
       BALL FOUND
       ========================================================= */

    ballTarget.addEventListener(

        "targetFound",

        function () {

            console.log(
                "BALL TARGET FOUND - Target 1"
            );


            activeTarget = 1;


            ballTracked = true;

            ballPoseLocked = true;

            ballStableTracking = false;

            ballStableFrames = 0;


            ballPendingMode =
                ballCurrentMode;


            ballModeConfirmFrames = 0;


            /*
                Immediately hide Apple.
            */

            appleTracked = false;

            applePoseLocked = true;

            appleStableTracking = false;

            appleStableFrames = 0;


            apple.setAttribute(
                "visible",
                false
            );


            /*
                Show Ball.
            */

            ball.setAttribute(
                "visible",
                true
            );


            resetPointerState();

        }

    );



    /* =========================================================
       BALL LOST
       ========================================================= */

    ballTarget.addEventListener(

        "targetLost",

        function () {

            console.log(
                "BALL TARGET LOST - Target 1"
            );


            ballTracked = false;

            ballPoseLocked = true;

            ballStableTracking = false;

            ballStableFrames = 0;


            ball.setAttribute(
                "visible",
                false
            );


            if (activeTarget === 1) {

                activeTarget = -1;

                resetPointerState();

            }

        }

    );



    /* =========================================================
       POINTER EVENTS
       ========================================================= */

    function setupPointerEvents() {

        const canvas =
            scene.canvas ||
            document.querySelector("canvas");


        if (!canvas) {

            requestAnimationFrame(
                setupPointerEvents
            );

            return;

        }


        canvas.style.touchAction =
            "none";


        canvas.addEventListener(

            "pointerdown",
            pointerDown,
            { passive: false }

        );


        canvas.addEventListener(

            "pointermove",
            pointerMove,
            { passive: false }

        );


        canvas.addEventListener(

            "pointerup",
            pointerUp,
            { passive: false }

        );


        canvas.addEventListener(

            "pointercancel",
            pointerCancel,
            { passive: false }

        );


        canvas.addEventListener(

            "contextmenu",

            function (event) {

                event.preventDefault();

            },

            { passive: false }

        );

    }



    /* =========================================================
       AR UPDATE LOOP
       ========================================================= */

    function updateAR() {


        /*
            APPLE STABILITY
        */

        if (

            appleTracked &&
            applePoseLocked

        ) {

            appleStableFrames++;


            if (

                appleStableFrames >=
                REQUIRED_STABLE_FRAMES

            ) {

                appleStableTracking =
                    true;


                applePoseLocked =
                    false;


                applePendingMode =
                    appleCurrentMode;


                appleModeConfirmFrames =
                    0;

            }

        }



        /*
            BALL STABILITY
        */

        if (

            ballTracked &&
            ballPoseLocked

        ) {

            ballStableFrames++;


            if (

                ballStableFrames >=
                REQUIRED_STABLE_FRAMES

            ) {

                ballStableTracking =
                    true;


                ballPoseLocked =
                    false;


                ballPendingMode =
                    ballCurrentMode;


                ballModeConfirmFrames =
                    0;

            }

        }



        /*
            APPLE
        */

        if (

            activeTarget === 0 &&
            appleTracked &&
            appleStableTracking

        ) {

            updateAppleMode();

            applyAppleTargetOrientation();

        }



        /*
            BALL
        */

        if (

            activeTarget === 1 &&
            ballTracked &&
            ballStableTracking

        ) {

            updateBallMode();

            applyBallTargetOrientation();

        }



        requestAnimationFrame(
            updateAR
        );

    }



    /* =========================================================
       INITIAL STATE
       ========================================================= */

    applyAppleRotation();

    applyBallRotation();


    apple.setAttribute(
        "visible",
        false
    );


    ball.setAttribute(
        "visible",
        false
    );


    resetPointerState();



    /* =========================================================
       START
       ========================================================= */

    scene.addEventListener(

        "loaded",

        function () {

            setupPointerEvents();

        }

    );


    requestAnimationFrame(
        updateAR
    );


});

</script>

</body>

</html>
