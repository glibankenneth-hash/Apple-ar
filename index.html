<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Children's Book</title>


<!-- =========================================================
     A-FRAME
     ========================================================= -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<!-- =========================================================
     STYLE
     ========================================================= -->

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

a-scene {
    width: 100%;
    height: 100%;
}

canvas {
    touch-action: none !important;
}

.mindar-ui-loading,
.mindar-ui-scanning,
.mindar-ui-error {
    display: none !important;
}

</style>

</head>


<body>


<!-- =========================================================
     AR SCENE
     ========================================================= -->

<a-scene
    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        uiScanning: no;
        uiLoading: no;
        uiError: no;

        warmupTolerance: 1;
        missTolerance: 1;

        filterMinCF: 0.001;
        filterBeta: 0.01;

        maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
>


<!-- =========================================================
     ASSETS
     ========================================================= -->

<a-assets>

    <a-asset-item
        id="appleModel"
        src="./Apple.glb">
    </a-asset-item>

    <a-asset-item
        id="ballModel"
        src="./Ball.glb">
    </a-asset-item>

</a-assets>


<!-- =========================================================
     CAMERA
     ========================================================= -->

<a-camera
    position="0 0 0"
    look-controls="enabled: false">
</a-camera>


<!-- =========================================================
     APPLE TARGET
     ========================================================= -->

<a-entity
    id="appleTarget"
    mindar-image-target="targetIndex: 0"
>

    <a-entity id="appleOrientation">

        <a-entity id="appleRotation">

            <a-gltf-model
                id="apple"
                src="#appleModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="4.54545 4.54545 4.54545"

                visible="false"
            ></a-gltf-model>

        </a-entity>

    </a-entity>

</a-entity>


<!-- =========================================================
     BALL TARGET
     ========================================================= -->

<a-entity
    id="ballTarget"
    mindar-image-target="targetIndex: 1"
>

    <a-entity id="ballOrientation">

        <a-entity id="ballRotation">

            <a-gltf-model
                id="ball"
                src="#ballModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="4.54545 4.54545 4.54545"

                visible="false"
            ></a-gltf-model>

        </a-entity>

    </a-entity>

</a-entity>


</a-scene>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", () => {

    const THREE = AFRAME.THREE;


    // ========================================================
    // ELEMENTS
    // ========================================================

    const appleTarget =
        document.querySelector("#appleTarget");

    const ballTarget =
        document.querySelector("#ballTarget");

    const apple =
        document.querySelector("#apple");

    const ball =
        document.querySelector("#ball");

    const appleOrientation =
        document.querySelector("#appleOrientation");

    const ballOrientation =
        document.querySelector("#ballOrientation");

    const appleRotation =
        document.querySelector("#appleRotation");

    const ballRotation =
        document.querySelector("#ballRotation");

    const scene =
        document.querySelector("a-scene");


    // ========================================================
    // ACTIVE TARGET
    // ========================================================

    let activeTarget = null;


    // ========================================================
    // BASE SCALE
    // ========================================================

    const BASE_SCALE = 4.54545;


    apple.object3D.scale.set(
        BASE_SCALE,
        BASE_SCALE,
        BASE_SCALE
    );

    ball.object3D.scale.set(
        BASE_SCALE,
        BASE_SCALE,
        BASE_SCALE
    );


    // ========================================================
    // FLOOR CORRECTION
    // ========================================================

    const FLOOR_CORRECTION =
        new THREE.Quaternion();

    FLOOR_CORRECTION.setFromEuler(
        new THREE.Euler(
            -Math.PI / 2,
            0,
            0,
            "XYZ"
        )
    );


    // ========================================================
    // ORIENTATION
    // ========================================================

    function applyOrientation(
        target,
        orientation
    ) {

        if (!target.object3D) {
            return;
        }


        const normal =
            new THREE.Vector3(
                0,
                0,
                1
            );


        normal.applyQuaternion(
            target.object3D.quaternion
        );


        const vertical =
            Math.abs(normal.y) < 0.5;


        if (vertical) {

            orientation.object3D
                .quaternion
                .identity();

        } else {

            orientation.object3D
                .quaternion
                .copy(
                    FLOOR_CORRECTION
                );

        }

    }


    // ========================================================
    // FAST TARGET SWITCH
    // ========================================================

    function activateApple() {

        activeTarget = 0;


        // Immediately hide the other object

        ball.setAttribute(
            "visible",
            "false"
        );


        // Immediately show Apple

        apple.setAttribute(
            "visible",
            "true"
        );


        // Apply orientation immediately

        applyOrientation(
            appleTarget,
            appleOrientation
        );

    }


    function activateBall() {

        activeTarget = 1;


        // Immediately hide the other object

        apple.setAttribute(
            "visible",
            "false"
        );


        // Immediately show Ball

        ball.setAttribute(
            "visible",
            "true"
        );


        // Apply orientation immediately

        applyOrientation(
            ballTarget,
            ballOrientation
        );

    }


    // ========================================================
    // APPLE FOUND
    // ========================================================

    appleTarget.addEventListener(
        "targetFound",
        () => {

            activateApple();

        }
    );


    // ========================================================
    // BALL FOUND
    // ========================================================

    ballTarget.addEventListener(
        "targetFound",
        () => {

            activateBall();

        }
    );


    // ========================================================
    // TARGET LOST
    //
    // Only hide the object if it is still the active target.
    // This prevents the old page from interfering with a new
    // page during a fast switch.
    // ========================================================

    appleTarget.addEventListener(
        "targetLost",
        () => {

            if (activeTarget === 0) {

                apple.setAttribute(
                    "visible",
                    "false"
                );

                activeTarget = null;

            }

        }
    );


    ballTarget.addEventListener(
        "targetLost",
        () => {

            if (activeTarget === 1) {

                ball.setAttribute(
                    "visible",
                    "false"
                );

                activeTarget = null;

            }

        }
    );


    // ========================================================
    // CONTINUOUS ORIENTATION UPDATE
    //
    // No artificial 4-frame delay.
    // ========================================================

    function orientationLoop() {

        if (activeTarget === 0) {

            applyOrientation(
                appleTarget,
                appleOrientation
            );

        }

        else if (activeTarget === 1) {

            applyOrientation(
                ballTarget,
                ballOrientation
            );

        }


        requestAnimationFrame(
            orientationLoop
        );

    }


    orientationLoop();


    // ========================================================
    // POINTER / TOUCH CONTROL
    // ========================================================

    const pointers = new Map();


    let rotating = false;

    let lastX = 0;

    let lastY = 0;


    let pinching = false;

    let pinchStartDistance = 0;

    let pinchStartScale = BASE_SCALE;


    // ========================================================
    // ACTIVE ROTATION OBJECT
    // ========================================================

    function getActiveRotationObject() {

        if (activeTarget === 0) {

            return appleRotation.object3D;

        }


        if (activeTarget === 1) {

            return ballRotation.object3D;

        }


        return null;

    }


    // ========================================================
    // ACTIVE MODEL
    // ========================================================

    function getActiveModel() {

        if (activeTarget === 0) {

            return apple.object3D;

        }


        if (activeTarget === 1) {

            return ball.object3D;

        }


        return null;

    }


    // ========================================================
    // POINTER DOWN
    // ========================================================

    scene.addEventListener(
        "pointerdown",
        (event) => {

            if (activeTarget === null) {
                return;
            }


            pointers.set(
                event.pointerId,
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );


            if (pointers.size === 1) {

                rotating = true;

                pinching = false;

                lastX =
                    event.clientX;

                lastY =
                    event.clientY;

            }


            if (pointers.size === 2) {

                rotating = false;

                pinching = true;


                const values =
                    Array.from(
                        pointers.values()
                    );


                const dx =
                    values[0].x -
                    values[1].x;

                const dy =
                    values[0].y -
                    values[1].y;


                pinchStartDistance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                const model =
                    getActiveModel();


                if (model) {

                    pinchStartScale =
                        model.scale.x;

                }

            }

        }
    );


    // ========================================================
    // POINTER MOVE
    // ========================================================

    scene.addEventListener(
        "pointermove",
        (event) => {

            if (!pointers.has(
                event.pointerId
            )) {

                return;

            }


            pointers.set(
                event.pointerId,
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );


            // =================================================
            // ONE FINGER ROTATION
            // =================================================

            if (
                pointers.size === 1 &&
                rotating
            ) {

                const rotationObject =
                    getActiveRotationObject();


                if (!rotationObject) {
                    return;
                }


                const dx =
                    event.clientX -
                    lastX;

                const dy =
                    event.clientY -
                    lastY;


                rotationObject.rotation.y
                    += dx * 0.01;


                rotationObject.rotation.x
                    += dy * 0.01;


                lastX =
                    event.clientX;

                lastY =
                    event.clientY;

            }


            // =================================================
            // TWO FINGER PINCH
            // =================================================

            if (
                pointers.size === 2 &&
                pinching
            ) {

                const values =
                    Array.from(
                        pointers.values()
                    );


                const dx =
                    values[0].x -
                    values[1].x;

                const dy =
                    values[0].y -
                    values[1].y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    pinchStartDistance <= 0
                ) {

                    return;

                }


                const factor =
                    distance /
                    pinchStartDistance;


                let newScale =
                    pinchStartScale *
                    factor;


                newScale =
                    Math.max(
                        0.3,
                        Math.min(
                            15.0,
                            newScale
                        )
                    );


                const model =
                    getActiveModel();


                if (model) {

                    model.scale.set(
                        newScale,
                        newScale,
                        newScale
                    );

                }

            }

        }
    );


    // ========================================================
    // POINTER END
    // ========================================================

    function pointerEnd(event) {

        pointers.delete(
            event.pointerId
        );


        if (pointers.size === 0) {

            rotating = false;

            pinching = false;

        }


        if (pointers.size === 1) {

            rotating = true;

            pinching = false;


            const remaining =
                Array.from(
                    pointers.values()
                )[0];


            if (remaining) {

                lastX =
                    remaining.x;

                lastY =
                    remaining.y;

            }

        }

    }


    scene.addEventListener(
        "pointerup",
        pointerEnd
    );


    scene.addEventListener(
        "pointercancel",
        pointerEnd
    );


    scene.addEventListener(
        "pointerleave",
        pointerEnd
    );


    // ========================================================
    // PREVENT PAGE SCROLL / ZOOM
    // ========================================================

    scene.addEventListener(
        "touchstart",
        (event) => {

            event.preventDefault();

        },
        {
            passive: false
        }
    );


    scene.addEventListener(
        "touchmove",
        (event) => {

            event.preventDefault();

        },
        {
            passive: false
        }
    );


    scene.addEventListener(
        "touchend",
        (event) => {

            event.preventDefault();

        },
        {
            passive: false
        }
    );

});

</script>


</body>
</html>
