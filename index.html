```html
<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Children's Book Test</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
}

</style>

</head>


<body>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        uiScanning: no;
        uiLoading: no;
        uiError: no;
        maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
>


<a-assets>

    <a-asset-item
        id="appleModel"
        src="./Apple.glb">
    </a-asset-item>

    <a-asset-item
        id="ballModel"
        src="./Ball.glb">
    </a-asset-item>

</a-assets>


<a-camera
    position="0 0 0"
    look-controls="enabled: false">
</a-camera>


<!-- =====================================================
     TARGET 0 = APPLE
     ===================================================== -->

<a-entity
    mindar-image-target="targetIndex: 0"
>

    <a-gltf-model

        src="#appleModel"

        position="0 0 0.1"

        rotation="0 0 0"

        scale="4.54545 4.54545 4.54545"

    ></a-gltf-model>

</a-entity>


<!-- =====================================================
     TARGET 1 = BALL
     ===================================================== -->

<a-entity
    mindar-image-target="targetIndex: 1"
>

    <a-gltf-model

        src="#ballModel"

        position="0 0 0.1"

        rotation="0 0 0"

        scale="4.54545 4.54545 4.54545"

    ></a-gltf-model>

</a-entity>


</a-scene>


<script>

/*
=========================================================
DEBUGGING
=========================================================
*/

document.addEventListener("DOMContentLoaded", function () {

    const appleTarget =
        document.querySelector(
            '[mindar-image-target="targetIndex: 0"]'
        );

    const ballTarget =
        document.querySelector(
            '[mindar-image-target="targetIndex: 1"]'
        );


    appleTarget.addEventListener(
        "targetFound",
        function () {

            console.log(
                "=============================="
            );

            console.log(
                "APPLE TARGET FOUND"
            );

            console.log(
                "Target Index: 0"
            );

            console.log(
                "=============================="
            );

        }
    );


    appleTarget.addEventListener(
        "targetLost",
        function () {

            console.log(
                "APPLE TARGET LOST"
            );

        }
    );


    ballTarget.addEventListener(
        "targetFound",
        function () {

            console.log(
                "=============================="
            );

            console.log(
                "BALL TARGET FOUND"
            );

            console.log(
                "Target Index: 1"
            );

            console.log(
                "=============================="
            );

        }
    );


    ballTarget.addEventListener(
        "targetLost",
        function () {

            console.log(
                "BALL TARGET LOST"
            );

        }
    );


    const apple =
        document.querySelector("#appleModel");


    const ball =
        document.querySelector("#ballModel");


    apple.addEventListener(
        "loaded",
        function () {

            console.log(
                "APPLE GLB LOADED"
            );

        }
    );


    apple.addEventListener(
        "error",
        function (event) {

            console.error(
                "APPLE GLB ERROR",
                event
            );

        }
    );


    ball.addEventListener(
        "loaded",
        function () {

            console.log(
                "BALL GLB LOADED"
            );

        }
    );


    ball.addEventListener(
        "error",
        function (event) {

            console.error(
                "BALL GLB ERROR",
                event
            );

        }
    );

});

</script>


</body>

</html>
```
