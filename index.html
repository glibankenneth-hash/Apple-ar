<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Apple AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            touch-action: none;

        }

        a-scene {

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        filterMinCF: 0.0001;
        filterBeta: 0.01;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded>


    <a-assets>

        <a-asset-item
            id="appleModel"
            src="./Apple.glb">
        </a-asset-item>

    </a-assets>


    <a-camera

        position="0 0 0"

        look-controls="enabled: false">

    </a-camera>


    <a-entity
        id="imageTarget"
        mindar-image-target="targetIndex: 0">


        <a-entity id="appleContainer">


            <a-gltf-model

                id="apple"

                src="#appleModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="1 1 1">

            </a-gltf-model>


        </a-entity>


    </a-entity>


</a-scene>


<script>


/* =========================================================
   ELEMENTS
========================================================= */

const scene =
    document.querySelector("a-scene");

const target =
    document.querySelector("#imageTarget");

const appleContainer =
    document.querySelector("#appleContainer");


/* =========================================================
   SETTINGS
========================================================= */

const MIN_SCALE = 0.3;

const MAX_SCALE = 3.0;


/*
    Rotation sensitivity.

    Higher = faster rotation.
*/

const ROTATION_SPEED = 2.5;


/* =========================================================
   ORIENTATION STATE
========================================================= */

let currentMode = "vertical";

let candidateMode = "vertical";

let candidateFrames = 0;

const ORIENTATION_CONFIRM_FRAMES = 12;

const VERTICAL_THRESHOLD = 0.55;

const FLOOR_THRESHOLD = 0.25;


/* =========================================================
   THREE.JS TEMP OBJECTS
========================================================= */

const targetQuaternion =
    new THREE.Quaternion();

const worldUp =
    new THREE.Vector3(0, 1, 0);

const targetNormal =
    new THREE.Vector3(0, 0, 1);

const rotatedNormal =
    new THREE.Vector3();


/* =========================================================
   FREE ROTATION
========================================================= */

/*
    Instead of storing X/Y/Z Euler angles, we maintain
    a quaternion.

    This allows the Apple to rotate freely in any direction.
*/

const userQuaternion =
    new THREE.Quaternion();


const dragQuaternion =
    new THREE.Quaternion();


const axis =
    new THREE.Vector3();


const rotationX =
    new THREE.Quaternion();


const rotationY =
    new THREE.Quaternion();


/* =========================================================
   SCALE
========================================================= */

let currentScale = 1;

let initialScale = 1;

let initialPinchDistance = null;


/* =========================================================
   MOUSE
========================================================= */

let mouseDown = false;

let mouseX = 0;

let mouseY = 0;


/* =========================================================
   TOUCH
========================================================= */

let touchRotating = false;

let touchX = 0;

let touchY = 0;


/* =========================================================
   TARGET ORIENTATION
========================================================= */

function detectTargetMode() {


    if (!target.object3D) {

        return currentMode;

    }


    targetQuaternion.copy(
        target.object3D.quaternion
    );


    targetNormal.set(
        0,
        0,
        1
    );


    rotatedNormal
        .copy(targetNormal)
        .applyQuaternion(targetQuaternion)
        .normalize();


    const verticalAmount =
        Math.abs(
            rotatedNormal.dot(worldUp)
        );


    let detectedMode;


    if (
        verticalAmount >
        VERTICAL_THRESHOLD
    ) {

        detectedMode = "floor";

    }

    else if (
        verticalAmount <
        FLOOR_THRESHOLD
    ) {

        detectedMode = "vertical";

    }

    else {

        detectedMode =
            currentMode;

    }


    return detectedMode;

}


/* =========================================================
   STABLE MODE SWITCH
========================================================= */

function updateTargetMode() {


    const detectedMode =
        detectTargetMode();


    if (
        detectedMode ===
        currentMode
    ) {

        candidateMode =
            currentMode;

        candidateFrames = 0;

        return;

    }


    if (
        detectedMode !==
        candidateMode
    ) {

        candidateMode =
            detectedMode;

        candidateFrames = 1;

        return;

    }


    candidateFrames++;


    if (
        candidateFrames >=
        ORIENTATION_CONFIRM_FRAMES
    ) {

        currentMode =
            candidateMode;

        candidateFrames = 0;

    }

}


/* =========================================================
   APPLY ROTATION
========================================================= */

function applyAppleRotation() {


    /*
        Start with the user quaternion.
    */

    dragQuaternion.copy(
        userQuaternion
    );


    /*
        Apply the floor correction only when needed.
    */

    if (
        currentMode ===
        "floor"
    ) {


        const floorCorrection =
            new THREE.Quaternion();


        floorCorrection.setFromAxisAngle(

            new THREE.Vector3(
                1,
                0,
                0
            ),

            THREE.MathUtils.degToRad(-90)

        );


        dragQuaternion.multiply(
            floorCorrection
        );

    }


    appleContainer.object3D.quaternion.copy(
        dragQuaternion
    );

}


/* =========================================================
   FREE DRAG ROTATION
========================================================= */

/*
    Horizontal drag:

        rotates around Y

    Vertical drag:

        rotates around X

    Diagonal drag:

        combines both.

    Quaternion multiplication prevents
    Euler-angle flipping/gimbal problems.
*/

function rotateFromDrag(
    deltaX,
    deltaY
) {


    const yaw =
        -deltaX *
        ROTATION_SPEED *
        0.01;


    const pitch =
        -deltaY *
        ROTATION_SPEED *
        0.01;


    rotationY.setFromAxisAngle(

        new THREE.Vector3(
            0,
            1,
            0
        ),

        yaw

    );


    rotationX.setFromAxisAngle(

        new THREE.Vector3(
            1,
            0,
            0
        ),

        pitch

    );


    /*
        Apply yaw and pitch to the current
        user rotation.
    */

    userQuaternion.premultiply(
        rotationY
    );


    userQuaternion.premultiply(
        rotationX
    );


    userQuaternion.normalize();


    applyAppleRotation();

}


/* =========================================================
   MOUSE DOWN
========================================================= */

document.addEventListener(
    "mousedown",
    function(event) {


        if (
            event.button !== 0
        ) {

            return;

        }


        mouseDown = true;


        mouseX =
            event.clientX;


        mouseY =
            event.clientY;

    }
);


/* =========================================================
   MOUSE MOVE
========================================================= */

document.addEventListener(
    "mousemove",
    function(event) {


        if (!mouseDown) {

            return;

        }


        const deltaX =
            event.clientX -
            mouseX;


        const deltaY =
            event.clientY -
            mouseY;


        rotateFromDrag(
            deltaX,
            deltaY
        );


        mouseX =
            event.clientX;


        mouseY =
            event.clientY;

    }
);


/* =========================================================
   MOUSE UP
========================================================= */

document.addEventListener(
    "mouseup",
    function() {

        mouseDown = false;

    }
);


/* =========================================================
   TOUCH START
========================================================= */

document.addEventListener(
    "touchstart",
    function(event) {


        /*
            PINCH
        */

        if (
            event.touches.length === 2
        ) {


            initialPinchDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            initialScale =
                currentScale;


            touchRotating =
                false;


            return;

        }


        /*
            SINGLE FINGER ROTATION
        */

        if (
            event.touches.length === 1
        ) {


            touchRotating =
                true;


            touchX =
                event.touches[0].clientX;


            touchY =
                event.touches[0].clientY;

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH MOVE
========================================================= */

document.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /*
            PINCH SCALE
        */

        if (
            event.touches.length === 2
        ) {


            const distance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            if (
                initialPinchDistance ===
                null
            ) {

                return;

            }


            const scaleFactor =
                distance /
                initialPinchDistance;


            let newScale =
                initialScale *
                scaleFactor;


            newScale =
                Math.max(
                    MIN_SCALE,
                    Math.min(
                        MAX_SCALE,
                        newScale
                    )
                );


            currentScale =
                newScale;


            appleContainer.object3D.scale.set(

                newScale,
                newScale,
                newScale

            );


            return;

        }


        /*
            FREE ONE-FINGER ROTATION
        */

        if (
            event.touches.length === 1 &&
            touchRotating
        ) {


            const currentX =
                event.touches[0].clientX;


            const currentY =
                event.touches[0].clientY;


            const deltaX =
                currentX -
                touchX;


            const deltaY =
                currentY -
                touchY;


            rotateFromDrag(
                deltaX,
                deltaY
            );


            touchX =
                currentX;


            touchY =
                currentY;

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
========================================================= */

document.addEventListener(
    "touchend",
    function(event) {


        if (
            event.touches.length < 2
        ) {

            initialPinchDistance =
                null;

        }


        if (
            event.touches.length === 0
        ) {

            touchRotating =
                false;

        }

    }
);


/* =========================================================
   PINCH DISTANCE
========================================================= */

function getDistance(
    touch1,
    touch2
) {


    const dx =
        touch1.clientX -
        touch2.clientX;


    const dy =
        touch1.clientY -
        touch2.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   AR UPDATE LOOP
========================================================= */

function updateAR() {


    if (
        target.object3D.visible
    ) {


        updateTargetMode();


        applyAppleRotation();

    }


    requestAnimationFrame(
        updateAR
    );

}


scene.addEventListener(
    "loaded",
    function() {

        requestAnimationFrame(
            updateAR
        );

    }
);


</script>


</body>
</html>
