<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Apple AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: transparent;
}

a-scene {
    width: 100%;
    height: 100%;
    touch-action: none;
}

canvas {
    touch-action: none;
}
</style>
</head>

<body>

<a-scene
    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        filterMinCF: 0.0001;
        filterBeta: 0.01;
    "
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
        <a-asset-item
            id="appleModel"
            src="./Apple.glb">
        </a-asset-item>
    </a-assets>

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity
        id="imageTarget"
        mindar-image-target="targetIndex: 0">

        <a-entity id="appleContainer">

            <a-gltf-model
                id="apple"
                src="#appleModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1">
            </a-gltf-model>

        </a-entity>

    </a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const scene = document.querySelector("a-scene");
    const target = document.querySelector("#imageTarget");
    const appleContainer = document.querySelector("#appleContainer");
    const apple = document.querySelector("#apple");

    const THREE = AFRAME.THREE;

    /*
    ============================================================
    AR ORIENTATION
    ============================================================
    */

    let currentMode = "vertical";
    let pendingMode = "vertical";
    let modeConfirmFrames = 0;

    const FLOOR_CORRECTION =
        new THREE.Quaternion().setFromEuler(
            new THREE.Euler(
                -Math.PI / 2,
                0,
                0,
                "XYZ"
            )
        );

    const worldUp = new THREE.Vector3(0, 1, 0);
    const targetNormal = new THREE.Vector3(0, 0, 1);
    const worldNormal = new THREE.Vector3();

    function updateTargetMode() {

        if (!target.object3D) return;

        target.object3D.getWorldQuaternion(
            target.object3D.__worldQuaternion ||
            (target.object3D.__worldQuaternion =
                new THREE.Quaternion())
        );

        const targetQuaternion =
            target.object3D.__worldQuaternion;

        worldNormal
            .copy(targetNormal)
            .applyQuaternion(targetQuaternion)
            .normalize();

        const verticalDot =
            Math.abs(worldNormal.dot(worldUp));

        let detectedMode;

        if (verticalDot > 0.55) {
            detectedMode = "floor";
        }
        else if (verticalDot < 0.25) {
            detectedMode = "vertical";
        }
        else {
            detectedMode = currentMode;
        }

        if (detectedMode !== pendingMode) {

            pendingMode = detectedMode;
            modeConfirmFrames = 0;

        }
        else {

            modeConfirmFrames++;

            if (
                modeConfirmFrames >= 12 &&
                currentMode !== pendingMode
            ) {

                currentMode = pendingMode;
            }
        }
    }


    /*
    ============================================================
    USER ROTATION
    ============================================================
    */

    const userQuaternion =
        new THREE.Quaternion();

    let pointerPositions = new Map();

    let isRotating = false;

    let previousTrackball =
        new THREE.Vector3();

    let rotationPointerId = null;

    /*
    Convert screen position into a virtual trackball.
    This allows horizontal, vertical AND diagonal
    finger movement to produce true 3D rotation.
    */

    function getTrackballVector(x, y) {

        const width = window.innerWidth;
        const height = window.innerHeight;

        let nx =
            (2 * x - width) /
            Math.min(width, height);

        let ny =
            (height - 2 * y) /
            Math.min(width, height);

        const lengthSquared =
            nx * nx + ny * ny;

        let z;

        if (lengthSquared <= 1) {

            z = Math.sqrt(
                1 - lengthSquared
            );

        }
        else {

            const length =
                Math.sqrt(lengthSquared);

            nx /= length;
            ny /= length;

            z = 0;
        }

        return new THREE.Vector3(
            nx,
            ny,
            z
        ).normalize();
    }


    /*
    ============================================================
    APPLY ROTATION
    ============================================================
    */

    function applyAppleRotation() {

        const finalQuaternion =
            userQuaternion.clone();

        /*
        If target is lying on the floor,
        rotate the Apple upright relative to the floor.
        */

        if (currentMode === "floor") {

            finalQuaternion.multiply(
                FLOOR_CORRECTION
            );
        }

        appleContainer.object3D.quaternion.copy(
            finalQuaternion
        );
    }


    /*
    ============================================================
    POINTER DOWN
    ============================================================
    */

    function onPointerDown(event) {

        pointerPositions.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );

        /*
        Only begin rotation when there is
        exactly one active pointer.
        */

        if (
            pointerPositions.size === 1
        ) {

            rotationPointerId =
                event.pointerId;

            previousTrackball =
                getTrackballVector(
                    event.clientX,
                    event.clientY
                );

            isRotating = true;
        }

        event.preventDefault();
    }


    /*
    ============================================================
    POINTER MOVE
    ============================================================
    */

    function onPointerMove(event) {

        if (
            !pointerPositions.has(
                event.pointerId
            )
        ) {
            return;
        }

        pointerPositions.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );

        /*
        If two fingers are active,
        rotation is temporarily disabled.
        This leaves the gesture available
        for pinch resizing.
        */

        if (pointerPositions.size !== 1) {

            isRotating = false;

            event.preventDefault();

            return;
        }

        if (
            !isRotating ||
            rotationPointerId !==
            event.pointerId
        ) {
            return;
        }

        const currentTrackball =
            getTrackballVector(
                event.clientX,
                event.clientY
            );

        /*
        IMPORTANT:
        The cross product order is reversed
        so the Apple follows the direction
        of the finger instead of rotating opposite
        to it.
        */

        const axis =
            new THREE.Vector3()
                .crossVectors(
                    currentTrackball,
                    previousTrackball
                )
                .normalize();

        const dot =
            THREE.MathUtils.clamp(
                previousTrackball.dot(
                    currentTrackball
                ),
                -1,
                1
            );

        const angle =
            Math.acos(dot);

        if (
            axis.lengthSq() > 0.0000001 &&
            angle > 0.00001
        ) {

            const deltaQuaternion =
                new THREE.Quaternion();

            deltaQuaternion.setFromAxisAngle(
                axis,
                angle
            );

            /*
            Accumulate the user's rotation.
            */

            userQuaternion.premultiply(
                deltaQuaternion
            );

            userQuaternion.normalize();

            applyAppleRotation();
        }

        previousTrackball.copy(
            currentTrackball
        );

        event.preventDefault();
    }


    /*
    ============================================================
    POINTER UP
    ============================================================
    */

    function onPointerUp(event) {

        pointerPositions.delete(
            event.pointerId
        );

        if (
            rotationPointerId ===
            event.pointerId
        ) {

            rotationPointerId = null;
            isRotating = false;
        }

        /*
        If another pointer remains,
        don't immediately start a new rotation.
        This prevents sudden jumps after
        pinch gestures.
        */

        event.preventDefault();
    }


    /*
    ============================================================
    POINTER CANCEL
    ============================================================
    */

    function onPointerCancel(event) {

        pointerPositions.delete(
            event.pointerId
        );

        if (
            rotationPointerId ===
            event.pointerId
        ) {

            rotationPointerId = null;
            isRotating = false;
        }
    }


    /*
    ============================================================
    PINCH TO RESIZE
    ============================================================
    */

    let initialPinchDistance = null;
    let initialScale = 1;

    function getDistance(a, b) {

        const dx =
            a.x - b.x;

        const dy =
            a.y - b.y;

        return Math.sqrt(
            dx * dx + dy * dy
        );
    }


    function handlePinch() {

        if (
            pointerPositions.size !== 2
        ) {

            initialPinchDistance = null;

            return;
        }

        const points =
            Array.from(
                pointerPositions.values()
            );

        const p1 = points[0];
        const p2 = points[1];

        const distance =
            getDistance(p1, p2);

        if (
            initialPinchDistance === null
        ) {

            initialPinchDistance =
                distance;

            initialScale =
                appleContainer.object3D.scale.x;

            return;
        }

        if (
            initialPinchDistance <= 0
        ) {
            return;
        }

        let newScale =
            initialScale *
            (distance /
             initialPinchDistance);

        newScale =
            THREE.MathUtils.clamp(
                newScale,
                0.3,
                3.0
            );

        appleContainer.object3D.scale.set(
            newScale,
            newScale,
            newScale
        );
    }


    /*
    ============================================================
    POINTER EVENTS
    ============================================================
    */

    const canvas =
        scene.canvas ||
        document.querySelector(
            "canvas"
        );

    function setupPointerEvents() {

        const element =
            scene.canvas ||
            document.querySelector(
                "canvas"
            );

        if (!element) {

            requestAnimationFrame(
                setupPointerEvents
            );

            return;
        }

        element.style.touchAction =
            "none";

        element.addEventListener(
            "pointerdown",
            onPointerDown,
            {
                passive: false
            }
        );

        element.addEventListener(
            "pointermove",
            onPointerMove,
            {
                passive: false
            }
        );

        element.addEventListener(
            "pointerup",
            onPointerUp,
            {
                passive: false
            }
        );

        element.addEventListener(
            "pointercancel",
            onPointerCancel,
            {
                passive: false
            }
        );

        /*
        Separate listener for pinch.
        */

        element.addEventListener(
            "pointermove",
            () => {
                handlePinch();
            },
            {
                passive: true
            }
        );

        /*
        Prevent browser gestures.
        */

        element.addEventListener(
            "gesturestart",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        element.addEventListener(
            "gesturechange",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        element.addEventListener(
            "gestureend",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );
    }


    /*
    ============================================================
    INITIALIZE
    ============================================================
    */

    scene.addEventListener(
        "loaded",
        () => {

            setupPointerEvents();

        }
    );


    /*
    ============================================================
    AR UPDATE LOOP
    ============================================================
    */

    function updateAR() {

        if (
            target.object3D &&
            target.object3D.visible
        ) {

            updateTargetMode();

            applyAppleRotation();
        }

        requestAnimationFrame(
            updateAR
        );
    }


    /*
    ============================================================
    START
    ============================================================
    */

    requestAnimationFrame(
        updateAR
    );

});
</script>

</body>
</html>
