<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Apple + Ball AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: none;

    background: transparent;
}

a-scene {
    width: 100%;
    height: 100%;

    touch-action: none;
}

canvas {
    touch-action: none !important;
}


/* =========================================================
   COMPLETELY HIDE MINDAR UI
   ========================================================= */

.mindar-ui-scanning,
.mindar-ui-loading,
.mindar-ui-error {
    display: none !important;
}

</style>
</head>


<body>


<a-scene
    mindar-image="
        imageTargetSrc: ./targets.mind;

        autoStart: true;

        uiScanning: no;
        uiLoading: no;
        uiError: no;

        warmupTolerance: 8;
        missTolerance: 8;

        filterMinCF: 0.0005;
        filterBeta: 0.001;

        maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
>


<!-- =========================================================
     MODELS
     ========================================================= -->

<a-assets>

    <a-asset-item
        id="appleModel"
        src="./Apple.glb">
    </a-asset-item>

    <a-asset-item
        id="ballModel"
        src="./Ball.glb">
    </a-asset-item>

</a-assets>



<!-- =========================================================
     CAMERA
     ========================================================= -->

<a-camera
    position="0 0 0"
    look-controls="enabled: false">
</a-camera>



<!-- =========================================================
     APPLE TARGET
     TARGET 0
     ========================================================= -->

<a-entity
    id="appleTarget"
    mindar-image-target="targetIndex: 0"
>


    <!-- TARGET ORIENTATION -->

    <a-entity id="appleOrientation">


        <!-- USER ROTATION -->

        <a-entity id="appleRotation">


            <a-gltf-model
                id="apple"

                src="#appleModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="1 1 1"

                visible="false"
            >
            </a-gltf-model>


        </a-entity>


    </a-entity>


</a-entity>



<!-- =========================================================
     BALL TARGET
     TARGET 1
     ========================================================= -->

<a-entity
    id="ballTarget"
    mindar-image-target="targetIndex: 1"
>


    <a-gltf-model
        id="ball"

        src="#ballModel"

        position="0 0 0"

        rotation="0 0 0"

        scale="1 1 1"

        visible="false"
    >
    </a-gltf-model>


</a-entity>



</a-scene>



<script>


document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const scene =
            document.querySelector(
                "a-scene"
            );


        /* -----------------------------------------------------
           APPLE
           ----------------------------------------------------- */

        const appleTarget =
            document.querySelector(
                "#appleTarget"
            );


        const appleOrientation =
            document.querySelector(
                "#appleOrientation"
            );


        const appleRotation =
            document.querySelector(
                "#appleRotation"
            );


        const apple =
            document.querySelector(
                "#apple"
            );


        /* -----------------------------------------------------
           BALL
           ----------------------------------------------------- */

        const ballTarget =
            document.querySelector(
                "#ballTarget"
            );


        const ball =
            document.querySelector(
                "#ball"
            );


        const THREE =
            AFRAME.THREE;



        /* =====================================================
           TRACKING STATE
           ===================================================== */

        let targetIsTracked =
            false;


        let poseLocked =
            true;


        let stableTracking =
            false;


        let stableFrames =
            0;


        const REQUIRED_STABLE_FRAMES =
            8;



        /* =====================================================
           TARGET ORIENTATION
           ===================================================== */

        let currentMode =
            "vertical";


        let pendingMode =
            "vertical";


        let modeConfirmFrames =
            0;


        const FLOOR_CORRECTION =
            new THREE.Quaternion().setFromEuler(

                new THREE.Euler(
                    -Math.PI / 2,
                    0,
                    0,
                    "XYZ"
                )

            );


        const worldUp =
            new THREE.Vector3(
                0,
                1,
                0
            );


        const targetNormal =
            new THREE.Vector3(
                0,
                0,
                1
            );


        const worldNormal =
            new THREE.Vector3();


        const targetQuaternion =
            new THREE.Quaternion();



        /* =====================================================
           GET TARGET ORIENTATION
           ===================================================== */

        function detectTargetMode() {


            if (
                !targetIsTracked
            ) {
                return null;
            }


            if (
                poseLocked
            ) {
                return null;
            }


            appleTarget.object3D.getWorldQuaternion(
                targetQuaternion
            );


            worldNormal
                .copy(targetNormal)
                .applyQuaternion(
                    targetQuaternion
                )
                .normalize();


            const verticalDot =
                Math.abs(
                    worldNormal.dot(
                        worldUp
                    )
                );


            if (
                verticalDot > 0.70
            ) {

                return "floor";

            }


            if (
                verticalDot < 0.20
            ) {

                return "vertical";

            }


            return currentMode;

        }



        /* =====================================================
           UPDATE TARGET MODE
           ===================================================== */

        function updateTargetMode() {


            if (
                !targetIsTracked ||
                poseLocked ||
                !stableTracking
            ) {
                return;
            }


            const detectedMode =
                detectTargetMode();


            if (
                detectedMode === null
            ) {
                return;
            }


            if (
                detectedMode !==
                pendingMode
            ) {

                pendingMode =
                    detectedMode;

                modeConfirmFrames =
                    0;

                return;

            }


            modeConfirmFrames++;


            if (
                modeConfirmFrames >= 20 &&
                currentMode !== pendingMode
            ) {

                currentMode =
                    pendingMode;

            }

        }



        /* =====================================================
           APPLY TARGET ORIENTATION
           ===================================================== */

        function applyTargetOrientation() {


            if (
                !targetIsTracked ||
                poseLocked ||
                !stableTracking
            ) {
                return;
            }


            if (
                currentMode ===
                "floor"
            ) {

                appleOrientation
                    .object3D
                    .quaternion
                    .copy(
                        FLOOR_CORRECTION
                    );

            }
            else {

                appleOrientation
                    .object3D
                    .quaternion
                    .identity();

            }

        }



        /* =====================================================
           USER ROTATION
           ===================================================== */

        let rotationX =
            0;


        let rotationY =
            0;


        const ROTATION_SPEED =
            0.010;



        function rotateApple(
            deltaX,
            deltaY
        ) {


            rotationY +=
                deltaX *
                ROTATION_SPEED;


            rotationX +=
                deltaY *
                ROTATION_SPEED;


            if (
                rotationX >
                Math.PI * 2
            ) {

                rotationX -=
                    Math.PI * 2;

            }


            if (
                rotationX <
                -Math.PI * 2
            ) {

                rotationX +=
                    Math.PI * 2;

            }


            if (
                rotationY >
                Math.PI * 2
            ) {

                rotationY -=
                    Math.PI * 2;

            }


            if (
                rotationY <
                -Math.PI * 2
            ) {

                rotationY +=
                    Math.PI * 2;

            }


            applyUserRotation();

        }



        function applyUserRotation() {


            appleRotation
                .object3D
                .rotation
                .x =
                rotationX;


            appleRotation
                .object3D
                .rotation
                .y =
                rotationY;


            appleRotation
                .object3D
                .rotation
                .z =
                0;

        }



        /* =====================================================
           POINTER STATE
           ===================================================== */

        const pointers =
            new Map();


        let rotationPointerId =
            null;


        let previousX =
            0;


        let previousY =
            0;


        let isRotating =
            false;



        /* =====================================================
           PINCH STATE
           ===================================================== */

        let pinchStartDistance =
            null;


        let pinchStartScale =
            1;



        function getPinchDistance() {


            if (
                pointers.size !== 2
            ) {

                return null;

            }


            const values =
                Array.from(
                    pointers.values()
                );


            const a =
                values[0];


            const b =
                values[1];


            const dx =
                a.x -
                b.x;


            const dy =
                a.y -
                b.y;


            return Math.sqrt(
                dx * dx +
                dy * dy
            );

        }



        function updatePinch() {


            const distance =
                getPinchDistance();


            if (
                distance === null
            ) {

                pinchStartDistance =
                    null;

                return;

            }


            if (
                pinchStartDistance ===
                null
            ) {

                pinchStartDistance =
                    distance;


                pinchStartScale =
                    apple
                        .object3D
                        .scale
                        .x;

                return;

            }


            let scale =
                pinchStartScale *
                (
                    distance /
                    pinchStartDistance
                );


            scale =
                THREE.MathUtils.clamp(
                    scale,
                    0.3,
                    3.0
                );


            apple.object3D.scale.set(
                scale,
                scale,
                scale
            );

        }



        /* =====================================================
           POINTER DOWN
           ===================================================== */

        function pointerDown(
            event
        ) {


            if (
                !targetIsTracked
            ) {
                return;
            }


            pointers.set(
                event.pointerId,
                {
                    x:
                        event.clientX,

                    y:
                        event.clientY
                }
            );


            if (
                pointers.size === 1
            ) {

                rotationPointerId =
                    event.pointerId;


                previousX =
                    event.clientX;


                previousY =
                    event.clientY;


                isRotating =
                    true;

            }
            else {

                isRotating =
                    false;


                rotationPointerId =
                    null;


                pinchStartDistance =
                    null;

            }


            try {

                event.target.setPointerCapture(
                    event.pointerId
                );

            }
            catch (error) {}


            event.preventDefault();

        }



        /* =====================================================
           POINTER MOVE
           ===================================================== */

        function pointerMove(
            event
        ) {


            if (
                !targetIsTracked
            ) {
                return;
            }


            if (
                !pointers.has(
                    event.pointerId
                )
            ) {
                return;
            }


            pointers.set(
                event.pointerId,
                {
                    x:
                        event.clientX,

                    y:
                        event.clientY
                }
            );


            if (
                pointers.size === 1 &&
                isRotating &&
                rotationPointerId ===
                event.pointerId
            ) {


                const deltaX =
                    event.clientX -
                    previousX;


                const deltaY =
                    event.clientY -
                    previousY;


                rotateApple(
                    deltaX,
                    deltaY
                );


                previousX =
                    event.clientX;


                previousY =
                    event.clientY;

            }
            else if (
                pointers.size === 2
            ) {


                isRotating =
                    false;


                updatePinch();

            }


            event.preventDefault();

        }



        /* =====================================================
           POINTER UP
           ===================================================== */

        function pointerUp(
            event
        ) {


            pointers.delete(
                event.pointerId
            );


            if (
                rotationPointerId ===
                event.pointerId
            ) {

                rotationPointerId =
                    null;

                isRotating =
                    false;

            }


            if (
                pointers.size < 2
            ) {

                pinchStartDistance =
                    null;

            }


            event.preventDefault();

        }



        /* =====================================================
           POINTER CANCEL
           ===================================================== */

        function pointerCancel(
            event
        ) {


            pointers.delete(
                event.pointerId
            );


            if (
                rotationPointerId ===
                event.pointerId
            ) {

                rotationPointerId =
                    null;

                isRotating =
                    false;

            }


            if (
                pointers.size < 2
            ) {

                pinchStartDistance =
                    null;

            }

        }



        /* =====================================================
           APPLE TARGET FOUND
           ===================================================== */

        appleTarget.addEventListener(
            "targetFound",
            function () {


                /* Hide Ball */

                ball.setAttribute(
                    "visible",
                    false
                );


                /* Apple is now the active object */

                targetIsTracked =
                    true;


                poseLocked =
                    true;


                stableTracking =
                    false;


                stableFrames =
                    0;


                pendingMode =
                    currentMode;


                modeConfirmFrames =
                    0;


                /* Show Apple */

                apple.setAttribute(
                    "visible",
                    true
                );


                pointers.clear();


                rotationPointerId =
                    null;


                isRotating =
                    false;


                pinchStartDistance =
                    null;

            }
        );



        /* =====================================================
           APPLE TARGET LOST
           ===================================================== */

        appleTarget.addEventListener(
            "targetLost",
            function () {


                /*
                    Lock Apple immediately.

                    Its rotation, scale and orientation
                    are NOT reset.
                */

                poseLocked =
                    true;


                stableTracking =
                    false;


                stableFrames =
                    0;


                targetIsTracked =
                    false;


                apple.setAttribute(
                    "visible",
                    false
                );


                pointers.clear();


                rotationPointerId =
                    null;


                isRotating =
                    false;


                pinchStartDistance =
                    null;

            }
        );



        /* =====================================================
           BALL TARGET FOUND
           ===================================================== */

        ballTarget.addEventListener(
            "targetFound",
            function () {


                /*
                    Hide Apple immediately.

                    This prevents both objects from
                    appearing when changing pages.
                */

                apple.setAttribute(
                    "visible",
                    false
                );


                /* Show Ball */

                ball.setAttribute(
                    "visible",
                    true
                );


                /*
                    Clear Apple touch state.
                */

                pointers.clear();


                rotationPointerId =
                    null;


                isRotating =
                    false;


                pinchStartDistance =
                    null;

            }
        );



        /* =====================================================
           BALL TARGET LOST
           ===================================================== */

        ballTarget.addEventListener(
            "targetLost",
            function () {


                ball.setAttribute(
                    "visible",
                    false
                );

            }
        );



        /* =====================================================
           POINTER EVENT SETUP
           ===================================================== */

        function setupPointerEvents() {


            const canvas =
                scene.canvas ||
                document.querySelector(
                    "canvas"
                );


            if (!canvas) {

                requestAnimationFrame(
                    setupPointerEvents
                );

                return;

            }


            canvas.style.touchAction =
                "none";


            canvas.addEventListener(
                "pointerdown",
                pointerDown,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "pointermove",
                pointerMove,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "pointerup",
                pointerUp,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "pointercancel",
                pointerCancel,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "contextmenu",
                function (event) {

                    event.preventDefault();

                },
                {
                    passive: false
                }
            );

        }



        /* =====================================================
           AR LOOP
           ===================================================== */

        function updateAR() {


            /*
                Apple stable-pose gate.

                We wait for several frames after
                detecting the Apple page before
                allowing MindAR to influence
                its floor/vertical orientation.
            */

            if (
                targetIsTracked &&
                poseLocked
            ) {


                stableFrames++;


                if (
                    stableFrames >=
                    REQUIRED_STABLE_FRAMES
                ) {


                    stableTracking =
                        true;


                    poseLocked =
                        false;


                    pendingMode =
                        currentMode;


                    modeConfirmFrames =
                        0;

                }

            }


            /*
                Only update Apple orientation
                when tracking is stable.
            */

            if (
                targetIsTracked &&
                stableTracking &&
                !poseLocked
            ) {

                updateTargetMode();

                applyTargetOrientation();

            }


            requestAnimationFrame(
                updateAR
            );

        }



        /* =====================================================
           START
           ===================================================== */

        scene.addEventListener(
            "loaded",
            function () {

                setupPointerEvents();

            }
        );


        applyUserRotation();


        apple.setAttribute(
            "visible",
            false
        );


        ball.setAttribute(
            "visible",
            false
        );


        requestAnimationFrame(
            updateAR
        );


    }

);

</script>

</body>
</html>
