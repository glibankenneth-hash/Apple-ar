<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>AR Children's Book</title>

  <!-- MindAR A-Frame setup: use ONLY these two scripts -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /*
      MindAR's actual camera video is placed behind the transparent AR canvas.
      This fixes devices where MindAR tracks the image but renders a black canvas.
    */
    #mindar-camera-feed {
      position: fixed !important;
      inset: 0 !important;
      display: block !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      object-fit: cover !important;
      object-position: center !important;
      z-index: 0 !important;
      background: #000 !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    a-scene canvas {
      background: transparent !important;
      touch-action: none !important;
    }

    #ar-status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      transform: translateX(-50%);
      padding: 10px 15px;
      border-radius: 8px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    #ar-status.hidden {
      display: none;
    }

    .mindar-ui-loading,
    .mindar-ui-scanning,
    .mindar-ui-error {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="ar-status">Starting camera…</div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiScanning: no;
      uiLoading: no;
      uiError: no;
      warmupTolerance: 3;
      missTolerance: 1;
      filterMinCF: 0.0005;
      filterBeta: 0.001;
      maxTrack: 1;
    "
    color-space="sRGB"
    renderer="
      alpha: true;
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item id="appleModel" src="./Apple.glb"></a-asset-item>
      <a-asset-item id="ballModel" src="./Ball.glb"></a-asset-item>
    </a-assets>

    <a-entity
      light="type: ambient; intensity: 1.2"
    ></a-entity>

    <a-entity
      light="type: directional; intensity: 1.5"
      position="1 2 1"
    ></a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- Apple target: first image in targets.mind -->
    <a-entity
      id="appleTarget"
      mindar-image-target="targetIndex: 0"
    >
      <a-entity id="appleOrientation">
        <a-entity id="appleRotation">
          <a-gltf-model
            id="apple"
            src="#appleModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="4.54545 4.54545 4.54545"
            visible="false"
          ></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Ball target: second image in targets.mind -->
    <a-entity
      id="ballTarget"
      mindar-image-target="targetIndex: 1"
    >
      <a-entity id="ballOrientation">
        <a-entity id="ballRotation">
          <a-gltf-model
            id="ball"
            src="#ballModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="4.54545 4.54545 4.54545"
            visible="false"
          ></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const THREE = AFRAME.THREE;

      const scene = document.querySelector("a-scene");
      const status = document.querySelector("#ar-status");

      const appleTarget = document.querySelector("#appleTarget");
      const ballTarget = document.querySelector("#ballTarget");

      const apple = document.querySelector("#apple");
      const ball = document.querySelector("#ball");

      const appleOrientation = document.querySelector("#appleOrientation");
      const ballOrientation = document.querySelector("#ballOrientation");

      const appleRotation = document.querySelector("#appleRotation");
      const ballRotation = document.querySelector("#ballRotation");

      const BASE_SCALE = 4.54545;

      let activeTarget = null;
      let videoPlaced = false;

      function showStatus(message) {
        status.textContent = message;
        status.classList.remove("hidden");
      }

      function hideStatus() {
        status.classList.add("hidden");
      }

      /*
        MindAR already has permission to use this video.
        We only make that same video visible behind the transparent 3D canvas.
        No second camera request is made.
      */
      function placeMindARCameraVideo() {
        if (videoPlaced) return true;

        const videos = Array.from(document.querySelectorAll("video"));

        const cameraVideo = videos.find((video) => {
          return video.srcObject !== null;
        });

        if (!cameraVideo) return false;

        cameraVideo.id = "mindar-camera-feed";
        cameraVideo.setAttribute("playsinline", "");
        cameraVideo.setAttribute("webkit-playsinline", "");
        cameraVideo.muted = true;
        cameraVideo.autoplay = true;

        /*
          Place the camera feed immediately before the AR scene.
          The scene canvas is transparent and stays above it.
        */
        if (cameraVideo.parentElement !== document.body) {
          document.body.insertBefore(cameraVideo, scene);
        } else {
          document.body.insertBefore(cameraVideo, scene);
        }

        cameraVideo.play().catch(() => {
          /* Camera permission already controls playback on mobile. */
        });

        videoPlaced = true;
        hideStatus();

        return true;
      }

      scene.addEventListener("arReady", () => {
        showStatus("Point your camera at a book page…");
        placeMindARCameraVideo();
      });

      scene.addEventListener("arError", () => {
        showStatus("Camera could not start. Open this page in Chrome or Safari and allow camera access.");
      });

      /*
        Some phones create the MindAR video element slightly after arReady.
      */
      const cameraCheck = setInterval(() => {
        if (placeMindARCameraVideo()) {
          clearInterval(cameraCheck);
        }
      }, 250);

      setTimeout(() => {
        if (!videoPlaced) {
          showStatus("Waiting for camera permission…");
        }
      }, 5000);

      const floorCorrection = new THREE.Quaternion();

      floorCorrection.setFromEuler(
        new THREE.Euler(-Math.PI / 2, 0, 0, "XYZ")
      );

      function applyOrientation(target, orientation) {
        if (!target.object3D || !orientation.object3D) return;

        const normal = new THREE.Vector3(0, 0, 1);

        normal.applyQuaternion(target.object3D.quaternion);

        const isVertical = Math.abs(normal.y) < 0.5;

        if (isVertical) {
          orientation.object3D.quaternion.identity();
        } else {
          orientation.object3D.quaternion.copy(floorCorrection);
        }
      }

      function showApple() {
        activeTarget = 0;

        ball.setAttribute("visible", "false");
        apple.setAttribute("visible", "true");

        applyOrientation(appleTarget, appleOrientation);
      }

      function showBall() {
        activeTarget = 1;

        apple.setAttribute("visible", "false");
        ball.setAttribute("visible", "true");

        applyOrientation(ballTarget, ballOrientation);
      }

      appleTarget.addEventListener("targetFound", showApple);
      ballTarget.addEventListener("targetFound", showBall);

      appleTarget.addEventListener("targetLost", () => {
        if (activeTarget !== 0) return;

        apple.setAttribute("visible", "false");
        activeTarget = null;
      });

      ballTarget.addEventListener("targetLost", () => {
        if (activeTarget !== 1) return;

        ball.setAttribute("visible", "false");
        activeTarget = null;
      });

      function trackingLoop() {
        if (activeTarget === 0) {
          applyOrientation(appleTarget, appleOrientation);
        }

        if (activeTarget === 1) {
          applyOrientation(ballTarget, ballOrientation);
        }

        requestAnimationFrame(trackingLoop);
      }

      trackingLoop();

      const pointers = new Map();

      let rotating = false;
      let pinching = false;

      let lastX = 0;
      let lastY = 0;

      let pinchStartDistance = 0;
      let pinchStartScale = BASE_SCALE;

      function getActiveRotationObject() {
        if (activeTarget === 0) return appleRotation.object3D;
        if (activeTarget === 1) return ballRotation.object3D;

        return null;
      }

      function getActiveModel() {
        if (activeTarget === 0) return apple.object3D;
        if (activeTarget === 1) return ball.object3D;

        return null;
      }

      function currentPointerDistance() {
        const values = Array.from(pointers.values());

        const dx = values[0].x - values[1].x;
        const dy = values[0].y - values[1].y;

        return Math.sqrt(dx * dx + dy * dy);
      }

      scene.addEventListener("pointerdown", (event) => {
        if (activeTarget === null) return;

        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        if (pointers.size === 1) {
          rotating = true;
          pinching = false;

          lastX = event.clientX;
          lastY = event.clientY;
        }

        if (pointers.size === 2) {
          rotating = false;
          pinching = true;

          pinchStartDistance = currentPointerDistance();

          const model = getActiveModel();

          if (model) {
            pinchStartScale = model.scale.x;
          }
        }
      });

      scene.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId)) return;

        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        if (pointers.size === 1 && rotating) {
          const rotationObject = getActiveRotationObject();

          if (!rotationObject) return;

          const dx = event.clientX - lastX;
          const dy = event.clientY - lastY;

          rotationObject.rotation.y += dx * 0.01;
          rotationObject.rotation.x += dy * 0.01;

          lastX = event.clientX;
          lastY = event.clientY;
        }

        if (pointers.size === 2 && pinching && pinchStartDistance > 0) {
          const factor = currentPointerDistance() / pinchStartDistance;

          let newScale = pinchStartScale * factor;

          newScale = Math.max(0.3, Math.min(15, newScale));

          const model = getActiveModel();

          if (model) {
            model.scale.set(newScale, newScale, newScale);
          }
        }
      });

      function pointerEnd(event) {
        pointers.delete(event.pointerId);

        if (pointers.size === 0) {
          rotating = false;
          pinching = false;
        }

        if (pointers.size === 1) {
          rotating = true;
          pinching = false;

          const remainingPointer = Array.from(pointers.values())[0];

          lastX = remainingPointer.x;
          lastY = remainingPointer.y;
        }
      }

      scene.addEventListener("pointerup", pointerEnd);
      scene.addEventListener("pointercancel", pointerEnd);
      scene.addEventListener("pointerleave", pointerEnd);

      scene.addEventListener(
        "touchstart",
        (event) => event.preventDefault(),
        { passive: false }
      );

      scene.addEventListener(
        "touchmove",
        (event) => event.preventDefault(),
        { passive: false }
      );

      scene.addEventListener(
        "touchend",
        (event) => event.preventDefault(),
        { passive: false }
      );
    });
  </script>
</body>
</html>
