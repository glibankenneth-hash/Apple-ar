<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>AR Children's Book</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #mindar-camera-feed {
      position: fixed !important;
      inset: 0 !important;
      display: block !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      object-position: center !important;
      z-index: 0 !important;
      background: #000 !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    a-scene canvas {
      background: transparent !important;
      touch-action: none !important;
    }

    #ar-status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      transform: translateX(-50%);
      padding: 10px 15px;
      border-radius: 8px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    #ar-status.hidden {
      display: none;
    }

    .mindar-ui-loading,
    .mindar-ui-scanning,
    .mindar-ui-error {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="ar-status">Starting camera…</div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiScanning: no;
      uiLoading: no;
      uiError: no;
      warmupTolerance: 3;
      missTolerance: 1;
      filterMinCF: 0.0005;
      filterBeta: 0.001;
      maxTrack: 1;
    "
    color-space="sRGB"
    renderer="
      alpha: true;
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item id="appleModel" src="./Apple.glb"></a-asset-item>
      <a-asset-item id="appleSliceModel" src="./AppleSlice.glb"></a-asset-item>
      <a-asset-item id="ballModel" src="./Ball.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 1.2"></a-entity>

    <a-entity
      light="type: directional; intensity: 1.5"
      position="1 2 1"
    ></a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- Apple target: targetIndex 0 -->
    <a-entity
      id="appleTarget"
      mindar-image-target="targetIndex: 0"
    >
      <a-entity id="appleOrientation">
        <a-entity id="appleRotation">
          <!-- Whole Apple -->
          <a-gltf-model
            id="apple"
            src="#appleModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="4.54545 4.54545 4.54545"
            visible="false"
          ></a-gltf-model>

          <!-- Sliced Apple with seeds -->
          <a-gltf-model
            id="appleSlice"
            src="#appleSliceModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="4.54545 4.54545 4.54545"
            visible="false"
          ></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Ball target: targetIndex 1 -->
    <a-entity
      id="ballTarget"
      mindar-image-target="targetIndex: 1"
    >
      <a-entity id="ballOrientation">
        <a-entity id="ballRotation">
          <a-gltf-model
            id="ball"
            src="#ballModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="4.54545 4.54545 4.54545"
            visible="false"
          ></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const THREE = AFRAME.THREE;

      const scene = document.querySelector("a-scene");
      const status = document.querySelector("#ar-status");

      const appleTarget = document.querySelector("#appleTarget");
      const ballTarget = document.querySelector("#ballTarget");

      const apple = document.querySelector("#apple");
      const appleSlice = document.querySelector("#appleSlice");
      const ball = document.querySelector("#ball");

      const appleOrientation = document.querySelector("#appleOrientation");
      const ballOrientation = document.querySelector("#ballOrientation");

      const appleRotation = document.querySelector("#appleRotation");
      const ballRotation = document.querySelector("#ballRotation");

      const BASE_SCALE = 4.54545;

      let activeTarget = null;
      let videoPlaced = false;

      let appleIsSliced = false;
      let appleSliceAnimating = false;

      let ballIsBouncing = false;
      let ballReturnTimer = null;

      const ballMaterialStates = new Map();
      const tapStarts = new Map();

      const tapRaycaster = new THREE.Raycaster();
      const tapPointer = new THREE.Vector2();

      function showStatus(message) {
        status.textContent = message;
        status.classList.remove("hidden");
      }

      function hideStatus() {
        status.classList.add("hidden");
      }

      function placeMindARCameraVideo() {
        if (videoPlaced) return true;

        const videos = Array.from(document.querySelectorAll("video"));

        const cameraVideo = videos.find((video) => {
          return video.srcObject !== null;
        });

        if (!cameraVideo) return false;

        cameraVideo.id = "mindar-camera-feed";
        cameraVideo.setAttribute("playsinline", "");
        cameraVideo.setAttribute("webkit-playsinline", "");
        cameraVideo.muted = true;
        cameraVideo.autoplay = true;

        document.body.insertBefore(cameraVideo, scene);

        cameraVideo.play().catch(() => {
          /* Camera permission controls playback on mobile. */
        });

        videoPlaced = true;
        hideStatus();

        return true;
      }

      scene.addEventListener("arReady", () => {
        showStatus("Point your camera at a book page…");
        placeMindARCameraVideo();
      });

      scene.addEventListener("arError", () => {
        showStatus("Camera could not start. Open this page in Chrome or Safari.");
      });

      const cameraCheck = setInterval(() => {
        if (placeMindARCameraVideo()) {
          clearInterval(cameraCheck);
        }
      }, 250);

      const floorCorrection = new THREE.Quaternion();

      floorCorrection.setFromEuler(
        new THREE.Euler(-Math.PI / 2, 0, 0, "XYZ")
      );

      function applyOrientation(target, orientation) {
        if (!target.object3D || !orientation.object3D) return;

        const normal = new THREE.Vector3(0, 0, 1);

        normal.applyQuaternion(target.object3D.quaternion);

        const isVertical = Math.abs(normal.y) < 0.5;

        if (isVertical) {
          orientation.object3D.quaternion.identity();
        } else {
          orientation.object3D.quaternion.copy(floorCorrection);
        }
      }

      function showWholeApple() {
        appleSlice.object3D.position.set(0, 0, 0);
        appleSlice.object3D.rotation.set(0, 0, 0);

        appleSlice.setAttribute("visible", "false");
        apple.setAttribute("visible", "true");

        appleIsSliced = false;
        appleSliceAnimating = false;
      }

      function sliceApple() {
        if (
          activeTarget !== 0 ||
          appleIsSliced ||
          appleSliceAnimating
        ) {
          return;
        }

        appleSliceAnimating = true;

        apple.setAttribute("visible", "false");

        appleSlice.object3D.position.set(0, 0, 0);
        appleSlice.object3D.rotation.set(0, 0, 0);

        appleSlice.setAttribute("visible", "true");

        const startTime = performance.now();
        const duration = 350;

        function animateSlice(currentTime) {
          const progress = Math.min(
            (currentTime - startTime) / duration,
            1
          );

          const easeOut = 1 - Math.pow(1 - progress, 3);

          appleSlice.object3D.position.set(
            0,
            easeOut * 0.08,
            easeOut * 0.08
          );

          appleSlice.object3D.rotation.y = easeOut * 0.18;

          if (progress < 1) {
            requestAnimationFrame(animateSlice);
            return;
          }

          appleIsSliced = true;
          appleSliceAnimating = false;
        }

        requestAnimationFrame(animateSlice);
      }

      function rememberBallMaterials() {
        ball.object3D.traverse((object) => {
          if (!object.isMesh) return;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach((material) => {
            if (!material || ballMaterialStates.has(material)) return;

            ballMaterialStates.set(material, {
              opacity: material.opacity,
              transparent: material.transparent
            });
          });
        });
      }

      function setBallOpacity(opacity) {
        ball.object3D.traverse((object) => {
          if (!object.isMesh) return;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach((material) => {
            if (!material) return;

            material.transparent = true;
            material.opacity = opacity;
            material.needsUpdate = true;
          });
        });
      }

      function restoreBallMaterials() {
        ballMaterialStates.forEach((state, material) => {
          material.opacity = state.opacity;
          material.transparent = state.transparent;
          material.needsUpdate = true;
        });
      }

      function resetBall() {
        ball.object3D.position.set(0, 0, 0);

        restoreBallMaterials();

        ballIsBouncing = false;

        if (activeTarget === 1) {
          ball.setAttribute("visible", "true");
        }
      }

      function bounceBall() {
        if (activeTarget !== 1 || ballIsBouncing) return;

        ballIsBouncing = true;

        if (ballReturnTimer) {
          clearTimeout(ballReturnTimer);
        }

        const startTime = performance.now();
        const duration = 420;

        function animateBounce(currentTime) {
          const progress = Math.min(
            (currentTime - startTime) / duration,
            1
          );

          const upwardArc = Math.sin(progress * Math.PI) * 0.75;

          ball.object3D.position.set(
            progress * 0.7,
            upwardArc,
            progress * 0.45
          );

          setBallOpacity(1 - progress);

          if (progress < 1) {
            requestAnimationFrame(animateBounce);
            return;
          }

          ball.setAttribute("visible", "false");

          ballReturnTimer = setTimeout(() => {
            resetBall();
          }, 500);
        }

        requestAnimationFrame(animateBounce);
      }

      function didTapObject(event, objectElement) {
        if (
          !scene.canvas ||
          !scene.camera ||
          !objectElement.object3D ||
          !objectElement.object3D.visible
        ) {
          return false;
        }

        const bounds = scene.canvas.getBoundingClientRect();

        tapPointer.x =
          ((event.clientX - bounds.left) / bounds.width) * 2 - 1;

        tapPointer.y =
          -((event.clientY - bounds.top) / bounds.height) * 2 + 1;

        tapRaycaster.setFromCamera(tapPointer, scene.camera);

        const intersections = tapRaycaster.intersectObject(
          objectElement.object3D,
          true
        );

        return intersections.length > 0;
      }

      ball.addEventListener("model-loaded", () => {
        rememberBallMaterials();
      });

      function showApple() {
        activeTarget = 0;

        ball.setAttribute("visible", "false");

        if (appleIsSliced) {
          apple.setAttribute("visible", "false");
          appleSlice.setAttribute("visible", "true");
        } else {
          showWholeApple();
        }

        applyOrientation(appleTarget, appleOrientation);
      }

      function showBall() {
        activeTarget = 1;

        apple.setAttribute("visible", "false");
        appleSlice.setAttribute("visible", "false");

        if (!ballIsBouncing) {
          resetBall();
        }

        ball.setAttribute("visible", "true");

        applyOrientation(ballTarget, ballOrientation);
      }

      appleTarget.addEventListener("targetFound", showApple);
      ballTarget.addEventListener("targetFound", showBall);

      appleTarget.addEventListener("targetLost", () => {
        if (activeTarget !== 0) return;

        apple.setAttribute("visible", "false");
        appleSlice.setAttribute("visible", "false");

        activeTarget = null;
      });

      ballTarget.addEventListener("targetLost", () => {
        if (activeTarget !== 1) return;

        ball.setAttribute("visible", "false");

        activeTarget = null;
      });

      function trackingLoop() {
        if (activeTarget === 0) {
          applyOrientation(appleTarget, appleOrientation);
        }

        if (activeTarget === 1) {
          applyOrientation(ballTarget, ballOrientation);
        }

        requestAnimationFrame(trackingLoop);
      }

      trackingLoop();

      const pointers = new Map();

      let rotating = false;
      let pinching = false;

      let lastX = 0;
      let lastY = 0;

      let pinchStartDistance = 0;
      let pinchStartScale = BASE_SCALE;

      function getActiveRotationObject() {
        if (activeTarget === 0) return appleRotation.object3D;
        if (activeTarget === 1) return ballRotation.object3D;

        return null;
      }

      function getActiveModel() {
        if (activeTarget === 0) {
          return appleIsSliced
            ? appleSlice.object3D
            : apple.object3D;
        }

        if (activeTarget === 1) {
          return ball.object3D;
        }

        return null;
      }

      function currentPointerDistance() {
        const values = Array.from(pointers.values());

        const dx = values[0].x - values[1].x;
        const dy = values[0].y - values[1].y;

        return Math.sqrt(dx * dx + dy * dy);
      }

      scene.addEventListener("pointerdown", (event) => {
        if (activeTarget === null || ballIsBouncing) return;

        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        tapStarts.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        if (pointers.size === 1) {
          rotating = true;
          pinching = false;

          lastX = event.clientX;
          lastY = event.clientY;
        }

        if (pointers.size === 2) {
          rotating = false;
          pinching = true;

          pinchStartDistance = currentPointerDistance();

          const model = getActiveModel();

          if (model) {
            pinchStartScale = model.scale.x;
          }
        }
      });

      scene.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId) || ballIsBouncing) return;

        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        if (pointers.size === 1 && rotating) {
          const rotationObject = getActiveRotationObject();

          if (!rotationObject) return;

          const dx = event.clientX - lastX;
          const dy = event.clientY - lastY;

          rotationObject.rotation.y += dx * 0.01;
          rotationObject.rotation.x += dy * 0.01;

          lastX = event.clientX;
          lastY = event.clientY;
        }

        if (pointers.size === 2 && pinching && pinchStartDistance > 0) {
          const factor = currentPointerDistance() / pinchStartDistance;

          let newScale = pinchStartScale * factor;

          newScale = Math.max(0.3, Math.min(15, newScale));

          const model = getActiveModel();

          if (model) {
            model.scale.set(newScale, newScale, newScale);
          }
        }
      });

      function finishPointer(event) {
        const tapStart = tapStarts.get(event.pointerId);

        if (
          event.type === "pointerup" &&
          tapStart &&
          pointers.size === 1
        ) {
          const movedX = event.clientX - tapStart.x;
          const movedY = event.clientY - tapStart.y;

          const tapDistance = Math.sqrt(
            movedX * movedX + movedY * movedY
          );

          if (tapDistance < 12) {
            if (activeTarget === 0) {
              if (!appleIsSliced && didTapObject(event, apple)) {
                sliceApple();
              } else if (
                appleIsSliced &&
                didTapObject(event, appleSlice)
              ) {
                showWholeApple();
              }
            }

            if (
              activeTarget === 1 &&
              !ballIsBouncing &&
              didTapObject(event, ball)
            ) {
              bounceBall();
            }
          }
        }

        pointers.delete(event.pointerId);
        tapStarts.delete(event.pointerId);

        if (pointers.size === 0) {
          rotating = false;
          pinching = false;
        }

        if (pointers.size === 1) {
          rotating = true;
          pinching = false;

          const remainingPointer = Array.from(pointers.values())[0];

          lastX = remainingPointer.x;
          lastY = remainingPointer.y;
        }
      }

      scene.addEventListener("pointerup", finishPointer);
      scene.addEventListener("pointercancel", finishPointer);
      scene.addEventListener("pointerleave", finishPointer);

      scene.addEventListener(
        "touchstart",
        (event) => event.preventDefault(),
        { passive: false }
      );

      scene.addEventListener(
        "touchmove",
        (event) => event.preventDefault(),
        { passive: false }
      );

      scene.addEventListener(
        "touchend",
        (event) => event.preventDefault(),
        { passive: false }
      );
    });
  </script>
</body>
</html>
