<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR Target Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;

      background: rgba(0,0,0,0.8);
      color: white;

      padding: 12px 16px;

      font-family: Arial, sans-serif;
      font-size: 16px;

      border-radius: 8px;
    }
  </style>
</head>

<body>

<div id="status">
  Starting AR...
</div>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    uiScanning: no;
    uiLoading: no;
    uiError: no;
    maxTrack: 1;
  "
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <!-- PAGE A -->
  <a-entity
    mindar-image-target="targetIndex: 0"
    id="pageA"
  >

    <a-box
      position="0 0 0.2"
      rotation="0 0 0"
      scale="0.7 0.7 0.7"
      color="red"
    ></a-box>

  </a-entity>


  <!-- PAGE B -->
  <a-entity
    mindar-image-target="targetIndex: 1"
    id="pageB"
  >

    <a-sphere
      position="0 0 0.2"
      radius="0.35"
      color="blue"
    ></a-sphere>

  </a-entity>


  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
  ></a-camera>

</a-scene>


<script>

const status = document.getElementById("status");

const pageA = document.getElementById("pageA");
const pageB = document.getElementById("pageB");

pageA.addEventListener("targetFound", () => {

  console.log("PAGE A FOUND");

  status.innerHTML = "PAGE A FOUND — RED BOX";

});

pageA.addEventListener("targetLost", () => {

  console.log("PAGE A LOST");

  status.innerHTML = "PAGE A LOST";

});


pageB.addEventListener("targetFound", () => {

  console.log("PAGE B FOUND");

  status.innerHTML = "PAGE B FOUND — BLUE SPHERE";

});

pageB.addEventListener("targetLost", () => {

  console.log("PAGE B LOST");

  status.innerHTML = "PAGE B LOST";

});

</script>

</body>
</html>
