<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Apple AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: none;

    background: transparent;
}

a-scene {
    width: 100%;
    height: 100%;

    touch-action: none;
}

canvas {
    touch-action: none !important;
}


/* =========================================================
   COMPLETELY HIDE MIN DAR UI
   ========================================================= */

.mindar-ui-scanning,
.mindar-ui-loading,
.mindar-ui-error {
    display: none !important;
}

</style>
</head>


<body>


<a-scene
    mindar-image="
        imageTargetSrc: ./targets.mind;

        autoStart: true;

        uiScanning: no;
        uiLoading: no;
        uiError: no;

        warmupTolerance: 8;
        missTolerance: 8;

        filterMinCF: 0.0005;
        filterBeta: 0.001;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
>


<a-assets>

    <a-asset-item
        id="appleModel"
        src="./Apple.glb">
    </a-asset-item>

</a-assets>


<a-camera
    position="0 0 0"
    look-controls="enabled: false">
</a-camera>


<a-entity
    id="imageTarget"
    mindar-image-target="targetIndex: 0"
>


    <!--
        TARGET ORIENTATION

        This layer handles whether the page is
        vertical or lying flat.
    -->

    <a-entity id="appleOrientation">


        <!--
            USER ROTATION

            This layer contains the user's
            touch rotation.
        -->

        <a-entity id="appleRotation">


            <a-gltf-model
                id="apple"

                src="#appleModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="1 1 1"

                visible="false"
            >
            </a-gltf-model>


        </a-entity>


    </a-entity>


</a-entity>


</a-scene>



<script>


document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const scene =
            document.querySelector(
                "a-scene"
            );


        const target =
            document.querySelector(
                "#imageTarget"
            );


        const appleOrientation =
            document.querySelector(
                "#appleOrientation"
            );


        const appleRotation =
            document.querySelector(
                "#appleRotation"
            );


        const apple =
            document.querySelector(
                "#apple"
            );


        const THREE =
            AFRAME.THREE;



        /* =====================================================
           TRACKING STATE
           ===================================================== */

        let targetIsTracked =
            false;


        /*
            TRUE when MindAR has lost the target.

            While TRUE, the target is NOT allowed
            to modify the Apple anymore.
        */

        let poseLocked =
            true;


        /*
            Prevents the target from changing the
            Apple orientation during the unstable
            edge-tracking period.
        */

        let stableTracking =
            false;


        /*
            Number of consecutive good frames.

            We don't immediately trust a newly
            detected target.
        */

        let stableFrames =
            0;


        const REQUIRED_STABLE_FRAMES =
            8;



        /* =====================================================
           TARGET ORIENTATION
           ===================================================== */

        let currentMode =
            "vertical";


        let pendingMode =
            "vertical";


        let modeConfirmFrames =
            0;


        const FLOOR_CORRECTION =
            new THREE.Quaternion().setFromEuler(

                new THREE.Euler(
                    -Math.PI / 2,
                    0,
                    0,
                    "XYZ"
                )

            );


        const worldUp =
            new THREE.Vector3(
                0,
                1,
                0
            );


        const targetNormal =
            new THREE.Vector3(
                0,
                0,
                1
            );


        const worldNormal =
            new THREE.Vector3();


        const targetQuaternion =
            new THREE.Quaternion();



        /* =====================================================
           GET TARGET ORIENTATION
           ===================================================== */

        function detectTargetMode() {


            if (
                !targetIsTracked
            ) {
                return null;
            }


            if (
                poseLocked
            ) {
                return null;
            }


            target.object3D.getWorldQuaternion(
                targetQuaternion
            );


            worldNormal
                .copy(targetNormal)
                .applyQuaternion(
                    targetQuaternion
                )
                .normalize();


            const verticalDot =
                Math.abs(
                    worldNormal.dot(
                        worldUp
                    )
                );


            /*
                VERY IMPORTANT:

                Ignore the dangerous middle zone.

                When the phone is almost looking away
                from the page, MindAR's estimated
                orientation can jump.

                We simply don't change mode there.
            */

            if (
                verticalDot > 0.70
            ) {

                return "floor";

            }


            if (
                verticalDot < 0.20
            ) {

                return "vertical";

            }


            /*
                Uncertain orientation.

                Keep whatever mode was already stable.
            */

            return currentMode;

        }



        /* =====================================================
           UPDATE TARGET MODE
           ===================================================== */

        function updateTargetMode() {


            if (
                !targetIsTracked ||
                poseLocked ||
                !stableTracking
            ) {
                return;
            }


            const detectedMode =
                detectTargetMode();


            if (
                detectedMode === null
            ) {
                return;
            }


            if (
                detectedMode !==
                pendingMode
            ) {

                pendingMode =
                    detectedMode;

                modeConfirmFrames =
                    0;

                return;

            }


            modeConfirmFrames++;


            /*
                Require many consecutive frames
                before changing floor/vertical mode.
            */

            if (
                modeConfirmFrames >= 20 &&
                currentMode !== pendingMode
            ) {

                currentMode =
                    pendingMode;

            }

        }



        /* =====================================================
           APPLY TARGET ORIENTATION
           ===================================================== */

        function applyTargetOrientation() {


            /*
                NEVER modify the Apple while
                pose is locked.
            */

            if (
                !targetIsTracked ||
                poseLocked ||
                !stableTracking
            ) {
                return;
            }


            if (
                currentMode ===
                "floor"
            ) {

                appleOrientation
                    .object3D
                    .quaternion
                    .copy(
                        FLOOR_CORRECTION
                    );

            }
            else {

                appleOrientation
                    .object3D
                    .quaternion
                    .identity();

            }

        }



        /* =====================================================
           USER ROTATION
           ===================================================== */

        let rotationX =
            0;


        let rotationY =
            0;


        const ROTATION_SPEED =
            0.010;



        function rotateApple(
            deltaX,
            deltaY
        ) {


            rotationY +=
                deltaX *
                ROTATION_SPEED;


            rotationX +=
                deltaY *
                ROTATION_SPEED;



            if (
                rotationX >
                Math.PI * 2
            ) {

                rotationX -=
                    Math.PI * 2;

            }


            if (
                rotationX <
                -Math.PI * 2
            ) {

                rotationX +=
                    Math.PI * 2;

            }


            if (
                rotationY >
                Math.PI * 2
            ) {

                rotationY -=
                    Math.PI * 2;

            }


            if (
                rotationY <
                -Math.PI * 2
            ) {

                rotationY +=
                    Math.PI * 2;

            }


            applyUserRotation();

        }



        function applyUserRotation() {


            appleRotation
                .object3D
                .rotation
                .x =
                rotationX;


            appleRotation
                .object3D
                .rotation
                .y =
                rotationY;


            appleRotation
                .object3D
                .rotation
                .z =
                0;

        }



        /* =====================================================
           POINTER STATE
           ===================================================== */

        const pointers =
            new Map();


        let rotationPointerId =
            null;


        let previousX =
            0;


        let previousY =
            0;


        let isRotating =
            false;



        /* =====================================================
           PINCH STATE
           ===================================================== */

        let pinchStartDistance =
            null;


        let pinchStartScale =
            1;



        function getPinchDistance() {


            if (
                pointers.size !== 2
            ) {

                return null;

            }


            const values =
                Array.from(
                    pointers.values()
                );


            const a =
                values[0];


            const b =
                values[1];


            const dx =
                a.x -
                b.x;


            const dy =
                a.y -
                b.y;


            return Math.sqrt(
                dx * dx +
                dy * dy
            );

        }



        function updatePinch() {


            const distance =
                getPinchDistance();


            if (
                distance === null
            ) {

                pinchStartDistance =
                    null;

                return;

            }


            if (
                pinchStartDistance ===
                null
            ) {

                pinchStartDistance =
                    distance;


                pinchStartScale =
                    apple
                        .object3D
                        .scale
                        .x;

                return;

            }


            let scale =
                pinchStartScale *
                (
                    distance /
                    pinchStartDistance
                );


            scale =
                THREE.MathUtils.clamp(
                    scale,
                    0.3,
                    3.0
                );


            apple.object3D.scale.set(
                scale,
                scale,
                scale
            );

        }



        /* =====================================================
           POINTER DOWN
           ===================================================== */

        function pointerDown(
            event
        ) {


            if (
                !targetIsTracked
            ) {
                return;
            }


            pointers.set(
                event.pointerId,
                {
                    x:
                        event.clientX,

                    y:
                        event.clientY
                }
            );


            if (
                pointers.size === 1
            ) {


                rotationPointerId =
                    event.pointerId;


                previousX =
                    event.clientX;


                previousY =
                    event.clientY;


                isRotating =
                    true;


            }
            else {


                isRotating =
                    false;


                rotationPointerId =
                    null;


                pinchStartDistance =
                    null;

            }


            try {

                event.target.setPointerCapture(
                    event.pointerId
                );

            }
            catch (error) {}


            event.preventDefault();

        }



        /* =====================================================
           POINTER MOVE
           ===================================================== */

        function pointerMove(
            event
        ) {


            if (
                !targetIsTracked
            ) {
                return;
            }


            if (
                !pointers.has(
                    event.pointerId
                )
            ) {
                return;
            }


            pointers.set(
                event.pointerId,
                {
                    x:
                        event.clientX,

                    y:
                        event.clientY
                }
            );



            if (
                pointers.size === 1 &&
                isRotating &&
                rotationPointerId ===
                event.pointerId
            ) {


                const deltaX =
                    event.clientX -
                    previousX;


                const deltaY =
                    event.clientY -
                    previousY;


                rotateApple(
                    deltaX,
                    deltaY
                );


                previousX =
                    event.clientX;


                previousY =
                    event.clientY;


            }
            else if (
                pointers.size === 2
            ) {


                isRotating =
                    false;


                updatePinch();

            }


            event.preventDefault();

        }



        /* =====================================================
           POINTER UP
           ===================================================== */

        function pointerUp(
            event
        ) {


            pointers.delete(
                event.pointerId
            );


            if (
                rotationPointerId ===
                event.pointerId
            ) {

                rotationPointerId =
                    null;

                isRotating =
                    false;

            }


            if (
                pointers.size < 2
            ) {

                pinchStartDistance =
                    null;

            }


            event.preventDefault();

        }



        /* =====================================================
           POINTER CANCEL
           ===================================================== */

        function pointerCancel(
            event
        ) {


            pointers.delete(
                event.pointerId
            );


            if (
                rotationPointerId ===
                event.pointerId
            ) {

                rotationPointerId =
                    null;

                isRotating =
                    false;

            }


            if (
                pointers.size < 2
            ) {

                pinchStartDistance =
                    null;

            }

        }



        /* =====================================================
           TARGET FOUND
           ===================================================== */

        target.addEventListener(
            "targetFound",
            function () {


                targetIsTracked =
                    true;


                /*
                    IMPORTANT:

                    Start locked.

                    We don't immediately trust
                    the first few frames of tracking.
                */

                poseLocked =
                    true;


                stableTracking =
                    false;


                stableFrames =
                    0;


                pendingMode =
                    currentMode;


                modeConfirmFrames =
                    0;


                /*
                    Apple becomes visible immediately,
                    but its LAST GOOD pose is preserved.
                */

                apple.setAttribute(
                    "visible",
                    true
                );


                pointers.clear();


                rotationPointerId =
                    null;


                isRotating =
                    false;


                pinchStartDistance =
                    null;

            }
        );



        /* =====================================================
           TARGET LOST
           ===================================================== */

        target.addEventListener(
            "targetLost",
            function () {


                /*
                    THIS IS THE MOST IMPORTANT PART.

                    Immediately lock the Apple.

                    From this point forward,
                    MindAR cannot change its
                    orientation through our code.
                */

                poseLocked =
                    true;


                stableTracking =
                    false;


                stableFrames =
                    0;


                targetIsTracked =
                    false;


                /*
                    Hide the Apple.

                    Its exact rotation,
                    scale,
                    floor mode and user
                    rotation remain untouched.
                */

                apple.setAttribute(
                    "visible",
                    false
                );


                pointers.clear();


                rotationPointerId =
                    null;


                isRotating =
                    false;


                pinchStartDistance =
                    null;

            }
        );



        /* =====================================================
           POINTER EVENT SETUP
           ===================================================== */

        function setupPointerEvents() {


            const canvas =
                scene.canvas ||
                document.querySelector(
                    "canvas"
                );


            if (!canvas) {

                requestAnimationFrame(
                    setupPointerEvents
                );

                return;

            }


            canvas.style.touchAction =
                "none";


            canvas.addEventListener(
                "pointerdown",
                pointerDown,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "pointermove",
                pointerMove,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "pointerup",
                pointerUp,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "pointercancel",
                pointerCancel,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "contextmenu",
                function (event) {

                    event.preventDefault();

                },
                {
                    passive: false
                }
            );

        }



        /* =====================================================
           AR LOOP
           ===================================================== */

        function updateAR() {


            /*
                -------------------------------------------------
                STABLE-POSE GATE
                -------------------------------------------------

                MindAR may report targetFound before
                the pose is completely stable.

                We wait for several frames before allowing
                the target to influence the Apple.
            */

            if (
                targetIsTracked &&
                poseLocked
            ) {


                stableFrames++;


                if (
                    stableFrames >=
                    REQUIRED_STABLE_FRAMES
                ) {


                    /*
                        Now tracking is considered
                        stable enough to update.
                    */

                    stableTracking =
                        true;


                    poseLocked =
                        false;


                    /*
                        Capture the mode only now.
                    */

                    pendingMode =
                        currentMode;


                    modeConfirmFrames =
                        0;

                }

            }



            /*
                Only update target orientation when
                the tracking gate is open.
            */

            if (
                targetIsTracked &&
                stableTracking &&
                !poseLocked
            ) {

                updateTargetMode();

                applyTargetOrientation();

            }



            requestAnimationFrame(
                updateAR
            );

        }



        /* =====================================================
           START
           ===================================================== */

        scene.addEventListener(
            "loaded",
            function () {

                setupPointerEvents();

            }
        );


        applyUserRotation();


        apple.setAttribute(
            "visible",
            false
        );


        requestAnimationFrame(
            updateAR
        );


    }

);

</script>

</body>
</html>
