<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Children's Book</title>


<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: none;

    background: transparent;
}


a-scene {

    width: 100%;
    height: 100%;

    touch-action: none;
}


canvas {

    touch-action: none !important;
}


.mindar-ui-scanning,
.mindar-ui-loading,
.mindar-ui-error {

    display: none !important;

}

</style>

</head>


<body>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;

        autoStart: true;

        uiScanning: no;
        uiLoading: no;
        uiError: no;

        warmupTolerance: 3;
        missTolerance: 2;

        filterMinCF: 0.0005;
        filterBeta: 0.001;

        maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
>


<!-- =========================================================
     ASSETS
     ========================================================= -->

<a-assets>

    <a-asset-item
        id="appleModel"
        src="./Apple.glb">
    </a-asset-item>


    <a-asset-item
        id="ballModel"
        src="./Ball.glb">
    </a-asset-item>

</a-assets>



<!-- =========================================================
     CAMERA
     ========================================================= -->

<a-camera

    position="0 0 0"

    look-controls="enabled: false">

</a-camera>



<!-- =========================================================
     PAGE A
     TARGET 0
     APPLE
     ========================================================= -->

<a-entity

    id="appleTarget"

    mindar-image-target="targetIndex: 0"
>


    <a-entity
        id="appleOrientation"
    >


        <a-entity
            id="appleRotation"
        >


            <a-gltf-model

                id="apple"

                src="#appleModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="4.54545 4.54545 4.54545"

                visible="false"

            ></a-gltf-model>


        </a-entity>

    </a-entity>

</a-entity>



<!-- =========================================================
     PAGE B
     TARGET 1
     BALL
     ========================================================= -->

<a-entity

    id="ballTarget"

    mindar-image-target="targetIndex: 1"
>


    <a-entity
        id="ballOrientation"
    >


        <a-entity
            id="ballRotation"
        >


            <a-gltf-model

                id="ball"

                src="#ballModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="4.54545 4.54545 4.54545"

                visible="false"

            ></a-gltf-model>


        </a-entity>

    </a-entity>

</a-entity>



</a-scene>



<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const THREE =
            AFRAME.THREE;


        const scene =
            document.querySelector(
                "a-scene"
            );



        const appleTarget =
            document.querySelector(
                "#appleTarget"
            );


        const appleOrientation =
            document.querySelector(
                "#appleOrientation"
            );


        const appleRotation =
            document.querySelector(
                "#appleRotation"
            );


        const apple =
            document.querySelector(
                "#apple"
            );



        const ballTarget =
            document.querySelector(
                "#ballTarget"
            );


        const ballOrientation =
            document.querySelector(
                "#ballOrientation"
            );


        const ballRotation =
            document.querySelector(
                "#ballRotation"
            );


        const ball =
            document.querySelector(
                "#ball"
            );



        let activeTarget =
            -1;



        let appleTracked =
            false;


        let applePoseLocked =
            true;


        let appleStableTracking =
            false;


        let appleStableFrames =
            0;


        const REQUIRED_STABLE_FRAMES =
            4;



        let appleCurrentMode =
            "vertical";


        let applePendingMode =
            "vertical";


        let appleModeConfirmFrames =
            0;



        const FLOOR_CORRECTION =
            new THREE.Quaternion().setFromEuler(

                new THREE.Euler(
                    -Math.PI / 2,
                    0,
                    0,
                    "XYZ"
                )

            );


        const worldUp =
            new THREE.Vector3(
                0,
                1,
                0
            );


        const targetNormal =
            new THREE.Vector3(
                0,
                0,
                1
            );


        const worldNormal =
            new THREE.Vector3();


        const targetQuaternion =
            new THREE.Quaternion();



        let ballTracked =
            false;


        let ballPoseLocked =
            true;


        let ballStableTracking =
            false;


        let ballStableFrames =
            0;



        let ballCurrentMode =
            "vertical";


        let ballPendingMode =
            "vertical";


        let ballModeConfirmFrames =
            0;



        let appleRotationX =
            0;


        let appleRotationY =
            0;


        let ballRotationX =
            0;


        let ballRotationY =
            0;


        const ROTATION_SPEED =
            0.010;



        function applyAppleRotation() {

            appleRotation
                .object3D
                .rotation
                .x =
                appleRotationX;


            appleRotation
                .object3D
                .rotation
                .y =
                appleRotationY;


            appleRotation
                .object3D
                .rotation
                .z =
                0;

        }



        function applyBallRotation() {

            ballRotation
                .object3D
                .rotation
                .x =
                ballRotationX;


            ballRotation
                .object3D
                .rotation
                .y =
                ballRotationY;


            ballRotation
                .object3D
                .rotation
                .z =
                0;

        }



        function rotateApple(
            deltaX,
            deltaY
        ) {

            appleRotationY +=
                deltaX *
                ROTATION_SPEED;


            appleRotationX +=
                deltaY *
                ROTATION_SPEED;


            appleRotationX =
                THREE.MathUtils.euclideanModulo(
                    appleRotationX +
                    Math.PI,
                    Math.PI * 2
                ) -
                Math.PI;


            appleRotationY =
                THREE.MathUtils.euclideanModulo(
                    appleRotationY +
                    Math.PI,
                    Math.PI * 2
                ) -
                Math.PI;


            applyAppleRotation();

        }



        function rotateBall(
            deltaX,
            deltaY
        ) {

            ballRotationY +=
                deltaX *
                ROTATION_SPEED;


            ballRotationX +=
                deltaY *
                ROTATION_SPEED;


            ballRotationX =
                THREE.MathUtils.euclideanModulo(
                    ballRotationX +
                    Math.PI,
                    Math.PI * 2
                ) -
                Math.PI;


            ballRotationY =
                THREE.MathUtils.euclideanModulo(
                    ballRotationY +
                    Math.PI,
                    Math.PI * 2
                ) -
                Math.PI;


            applyBallRotation();

        }



        const pointers =
            new Map();


        let rotationPointerId =
            null;


        let previousX =
            0;


        let previousY =
            0;


        let isRotating =
            false;


        let pinchStartDistance =
            null;


        let pinchStartScale =
            1;


        let pinchObject =
            null;



        function getPinchDistance() {

            if (
                pointers.size !== 2
            ) {

                return null;

            }


            const values =
                Array.from(
                    pointers.values()
                );


            const a =
                values[0];


            const b =
                values[1];


            const dx =
                a.x -
                b.x;


            const dy =
                a.y -
                b.y;


            return Math.sqrt(
                dx * dx +
                dy * dy
            );

        }



        function resetPointerState() {

            pointers.clear();

            rotationPointerId =
                null;

            isRotating =
                false;

            pinchStartDistance =
                null;

            pinchObject =
                null;

        }



        function updatePinch() {

            const distance =
                getPinchDistance();


            if (
                distance === null
            ) {

                pinchStartDistance =
                    null;

                pinchObject =
                    null;

                return;

            }


            let object =
                null;


            if (
                activeTarget === 0
            ) {

                object =
                    apple;

            }
            else if (
                activeTarget === 1
            ) {

                object =
                    ball;

            }


            if (!object) {
                return;
            }


            if (
                pinchStartDistance ===
                null
            ) {

                pinchStartDistance =
                    distance;


                pinchStartScale =
                    object
                        .object3D
                        .scale
                        .x;


                pinchObject =
                    object;


                return;

            }


            let scale =
                pinchStartScale *
                (
                    distance /
                    pinchStartDistance
                );


            scale =
                THREE.MathUtils.clamp(
                    scale,
                    0.3,
                    15.0
                );


            object.object3D.scale.set(
                scale,
                scale,
                scale
            );

        }



        function pointerDown(
            event
        ) {


            if (
                activeTarget === -1
            ) {
                return;
            }


            pointers.set(

                event.pointerId,

                {
                    x:
                        event.clientX,

                    y:
                        event.clientY
                }

            );


            if (
                pointers.size === 1
            ) {

                rotationPointerId =
                    event.pointerId;


                previousX =
                    event.clientX;


                previousY =
                    event.clientY;


                isRotating =
                    true;

            }
            else {

                isRotating =
                    false;


                rotationPointerId =
                    null;


                pinchStartDistance =
                    null;

            }


            try {

                event.target.setPointerCapture(
                    event.pointerId
                );

            }
            catch (error) {}


            event.preventDefault();

        }



        function pointerMove(
            event
        ) {


            if (
                activeTarget === -1
            ) {
                return;
            }


            if (
                !pointers.has(
                    event.pointerId
                )
            ) {
                return;
            }


            pointers.set(

                event.pointerId,

                {
                    x:
                        event.clientX,

                    y:
                        event.clientY
                }

            );


            if (

                pointers.size === 1 &&

                isRotating &&

                rotationPointerId ===
                event.pointerId

            ) {


                const deltaX =
                    event.clientX -
                    previousX;


                const deltaY =
                    event.clientY -
                    previousY;


                if (
                    activeTarget === 0
                ) {

                    rotateApple(
                        deltaX,
                        deltaY
                    );

                }
                else if (
                    activeTarget === 1
                ) {

                    rotateBall(
                        deltaX,
                        deltaY
                    );

                }


                previousX =
                    event.clientX;


                previousY =
                    event.clientY;

            }


            else if (
                pointers.size === 2
            ) {

                isRotating =
                    false;


                updatePinch();

            }


            event.preventDefault();

        }



        function pointerUp(
            event
        ) {

            pointers.delete(
                event.pointerId
            );


            if (
                rotationPointerId ===
                event.pointerId
            ) {

                rotationPointerId =
                    null;

                isRotating =
                    false;

            }


            if (
                pointers.size < 2
            ) {

                pinchStartDistance =
                    null;

                pinchObject =
                    null;

            }


            event.preventDefault();

        }



        function pointerCancel(
            event
        ) {

            pointers.delete(
                event.pointerId
            );


            if (
                rotationPointerId ===
                event.pointerId
            ) {

                rotationPointerId =
                    null;

                isRotating =
                    false;

            }


            if (
                pointers.size < 2
            ) {

                pinchStartDistance =
                    null;

                pinchObject =
                    null;

            }

        }



        function detectAppleMode() {

            if (
                !appleTracked ||
                applePoseLocked
            ) {
                return null;
            }


            appleTarget.object3D.getWorldQuaternion(
                targetQuaternion
            );


            worldNormal
                .copy(targetNormal)
                .applyQuaternion(
                    targetQuaternion
                )
                .normalize();


            const verticalDot =
                Math.abs(
                    worldNormal.dot(
                        worldUp
                    )
                );


            if (
                verticalDot > 0.70
            ) {

                return "floor";

            }


            if (
                verticalDot < 0.20
            ) {

                return "vertical";

            }


            return appleCurrentMode;

        }



        function detectBallMode() {

            if (
                !ballTracked ||
                ballPoseLocked
            ) {
                return null;
            }


            ballTarget.object3D.getWorldQuaternion(
                targetQuaternion
            );


            worldNormal
                .copy(targetNormal)
                .applyQuaternion(
                    targetQuaternion
                )
                .normalize();


            const verticalDot =
                Math.abs(
                    worldNormal.dot(
                        worldUp
                    )
                );


            if (
                verticalDot > 0.70
            ) {

                return "floor";

            }


            if (
                verticalDot < 0.20
            ) {

                return "vertical";

            }


            return ballCurrentMode;

        }



        function applyAppleTargetOrientation() {

            if (
                !appleTracked ||
                applePoseLocked ||
                !appleStableTracking
            ) {
                return;
            }


            if (
                appleCurrentMode ===
                "floor"
            ) {

                appleOrientation
                    .object3D
                    .quaternion
                    .copy(
                        FLOOR_CORRECTION
                    );

            }
            else {

                appleOrientation
                    .object3D
                    .quaternion
                    .identity();

            }

        }



        function applyBallTargetOrientation() {

            if (
                !ballTracked ||
                ballPoseLocked ||
                !ballStableTracking
            ) {
                return;
            }


            if (
                ballCurrentMode ===
                "floor"
            ) {

                ballOrientation
                    .object3D
                    .quaternion
                    .copy(
                        FLOOR_CORRECTION
                    );

            }
            else {

                ballOrientation
                    .object3D
                    .quaternion
                    .identity();

            }

        }



        function updateAppleMode() {

            if (
                !appleTracked ||
                applePoseLocked ||
                !appleStableTracking
            ) {
                return;
            }


            const detected =
                detectAppleMode();


            if (
                detected === null
            ) {
                return;
            }


            if (
                detected !==
                applePendingMode
            ) {

                applePendingMode =
                    detected;

                appleModeConfirmFrames =
                    0;

                return;

            }


            appleModeConfirmFrames++;


            if (
                appleModeConfirmFrames >= 12 &&
                appleCurrentMode !==
                applePendingMode
            ) {

                appleCurrentMode =
                    applePendingMode;

            }

        }



        function updateBallMode() {

            if (
                !ballTracked ||
                ballPoseLocked ||
                !ballStableTracking
            ) {
                return;
            }


            const detected =
                detectBallMode();


            if (
                detected === null
            ) {
                return;
            }


            if (
                detected !==
                ballPendingMode
            ) {

                ballPendingMode =
                    detected;

                ballModeConfirmFrames =
                    0;

                return;

            }


            ballModeConfirmFrames++;


            if (
                ballModeConfirmFrames >= 12 &&
                ballCurrentMode !==
                ballPendingMode
            ) {

                ballCurrentMode =
                    ballPendingMode;

            }

        }



        appleTarget.addEventListener(
            "targetFound",
            function () {


                console.log(
                    "APPLE TARGET FOUND - Target 0"
                );


                activeTarget =
                    0;


                appleTracked =
                    true;


                applePoseLocked =
                    true;


                appleStableTracking =
                    false;


                appleStableFrames =
                    0;


                applePendingMode =
                    appleCurrentMode;


                appleModeConfirmFrames =
                    0;


                ballTracked =
                    false;


                ballPoseLocked =
                    true;


                ballStableTracking =
                    false;


                ballStableFrames =
                    0;


                ball.setAttribute(
                    "visible",
                    false
                );


                apple.setAttribute(
                    "visible",
                    true
                );


                resetPointerState();

            }
        );



        appleTarget.addEventListener(
            "targetLost",
            function () {


                console.log(
                    "APPLE TARGET LOST - Target 0"
                );


                appleTracked =
                    false;


                applePoseLocked =
                    true;


                appleStableTracking =
                    false;


                appleStableFrames =
                    0;


                apple.setAttribute(
                    "visible",
                    false
                );


                if (
                    activeTarget === 0
                ) {

                    activeTarget =
                        -1;

                    resetPointerState();

                }

            }
        );



        ballTarget.addEventListener(
            "targetFound",
            function () {


                console.log(
                    "BALL TARGET FOUND - Target 1"
                );


                activeTarget =
                    1;


                ballTracked =
                    true;


                ballPoseLocked =
                    true;


                ballStableTracking =
                    false;


                ballStableFrames =
                    0;


                ballPendingMode =
                    ballCurrentMode;


                ballModeConfirmFrames =
                    0;


                appleTracked =
                    false;


                applePoseLocked =
                    true;


                appleStableTracking =
                    false;


                appleStableFrames =
                    0;


                apple.setAttribute(
                    "visible",
                    false
                );


                ball.setAttribute(
                    "visible",
                    true
                );


                resetPointerState();

            }
        );



        ballTarget.addEventListener(
            "targetLost",
            function () {


                console.log(
                    "BALL TARGET LOST - Target 1"
                );


                ballTracked =
                    false;


                ballPoseLocked =
                    true;


                ballStableTracking =
                    false;


                ballStableFrames =
                    0;


                ball.setAttribute(
                    "visible",
                    false
                );


                if (
                    activeTarget === 1
                ) {

                    activeTarget =
                        -1;

                    resetPointerState();

                }

            }
        );



        function setupPointerEvents() {


            const canvas =
                scene.canvas ||
                document.querySelector(
                    "canvas"
                );


            if (!canvas) {

                requestAnimationFrame(
                    setupPointerEvents
                );

                return;

            }


            canvas.style.touchAction =
                "none";


            canvas.addEventListener(
                "pointerdown",
                pointerDown,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "pointermove",
                pointerMove,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "pointerup",
                pointerUp,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "pointercancel",
                pointerCancel,
                {
                    passive: false
                }
            );


            canvas.addEventListener(
                "contextmenu",
                function (event) {

                    event.preventDefault();

                },
                {
                    passive: false
                }
            );

        }



        function updateAR() {


            if (
                appleTracked &&
                applePoseLocked
            ) {

                appleStableFrames++;


                if (
                    appleStableFrames >=
                    REQUIRED_STABLE_FRAMES
                ) {

                    appleStableTracking =
                        true;


                    applePoseLocked =
                        false;


                    applePendingMode =
                        appleCurrentMode;


                    appleModeConfirmFrames =
                        0;

                }

            }



            if (
                ballTracked &&
                ballPoseLocked
            ) {

                ballStableFrames++;


                if (
                    ballStableFrames >=
                    REQUIRED_STABLE_FRAMES
                ) {

                    ballStableTracking =
                        true;


                    ballPoseLocked =
                        false;


                    ballPendingMode =
                        ballCurrentMode;


                    ballModeConfirmFrames =
                        0;

                }

            }



            if (
                activeTarget === 0 &&
                appleTracked &&
                appleStableTracking &&
                !applePoseLocked
            ) {

                updateAppleMode();

                applyAppleTargetOrientation();

            }



            if (
                activeTarget === 1 &&
                ballTracked &&
                ballStableTracking &&
                !ballPoseLocked
            ) {

                updateBallMode();

                applyBallTargetOrientation();

            }


            requestAnimationFrame(
                updateAR
            );

        }



        applyAppleRotation();

        applyBallRotation();


        apple.setAttribute(
            "visible",
            false
        );


        ball.setAttribute(
            "visible",
            false
        );


        resetPointerState();



        scene.addEventListener(
            "loaded",
            function () {

                setupPointerEvents();

            }
        );


        requestAnimationFrame(
            updateAR
        );


    }

);

</script>


</body>
</html>
