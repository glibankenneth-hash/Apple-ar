<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Children's Book</title>


<!-- =========================================================
     A-FRAME
     ========================================================= -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


<!-- =========================================================
     MINDAR
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<!-- =========================================================
     STYLE
     ========================================================= -->

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

}


/* =========================================================
   MINDAR CAMERA VIDEO
   ========================================================= */

video {

    position: fixed !important;

    top: 0 !important;
    left: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    object-fit: cover !important;

    z-index: 0 !important;

    display: block !important;

    visibility: visible !important;

    opacity: 1 !important;

}


/* =========================================================
   A-FRAME
   ========================================================= */

a-scene {

    position: fixed !important;

    top: 0;
    left: 0;

    width: 100vw !important;
    height: 100vh !important;

    z-index: 1 !important;

    background: transparent !important;

}


/* =========================================================
   A-FRAME CANVAS
   ========================================================= */

canvas {

    position: fixed !important;

    top: 0 !important;
    left: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    background: transparent !important;

    z-index: 1 !important;

    touch-action: none !important;

}


/* =========================================================
   HIDE MINDAR UI
   ========================================================= */

.mindar-ui-loading,
.mindar-ui-scanning,
.mindar-ui-error {

    display: none !important;

}

</style>

</head>


<body>


<!-- =========================================================
     AR SCENE
     ========================================================= -->

<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;

        autoStart: true;

        uiScanning: no;
        uiLoading: no;
        uiError: no;

        warmupTolerance: 3;
        missTolerance: 1;

        filterMinCF: 0.0005;
        filterBeta: 0.001;

        maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        antialias: true;
        alpha: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
>


<!-- =========================================================
     ASSETS
     ========================================================= -->

<a-assets>

    <a-asset-item
        id="appleModel"
        src="./Apple.glb">
    </a-asset-item>

    <a-asset-item
        id="ballModel"
        src="./Ball.glb">
    </a-asset-item>

</a-assets>


<!-- =========================================================
     CAMERA
     ========================================================= -->

<a-camera
    position="0 0 0"
    look-controls="enabled: false">
</a-camera>


<!-- =========================================================
     APPLE
     TARGET INDEX 0
     ========================================================= -->

<a-entity
    id="appleTarget"
    mindar-image-target="targetIndex: 0"
>

    <a-entity id="appleOrientation">

        <a-entity id="appleRotation">

            <a-gltf-model

                id="apple"

                src="#appleModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="4.54545 4.54545 4.54545"

                visible="false"

            ></a-gltf-model>

        </a-entity>

    </a-entity>

</a-entity>


<!-- =========================================================
     BALL
     TARGET INDEX 1
     ========================================================= -->

<a-entity
    id="ballTarget"
    mindar-image-target="targetIndex: 1"
>

    <a-entity id="ballOrientation">

        <a-entity id="ballRotation">

            <a-gltf-model

                id="ball"

                src="#ballModel"

                position="0 0 0"

                rotation="0 0 0"

                scale="4.54545 4.54545 4.54545"

                visible="false"

            ></a-gltf-model>

        </a-entity>

    </a-entity>

</a-entity>


</a-scene>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

const THREE = AFRAME.THREE;


/* =========================================================
   ELEMENTS
   ========================================================= */

const scene =
    document.querySelector("a-scene");

const appleTarget =
    document.querySelector("#appleTarget");

const ballTarget =
    document.querySelector("#ballTarget");

const appleOrientation =
    document.querySelector("#appleOrientation");

const ballOrientation =
    document.querySelector("#ballOrientation");

const appleRotation =
    document.querySelector("#appleRotation");

const ballRotation =
    document.querySelector("#ballRotation");

const apple =
    document.querySelector("#apple");

const ball =
    document.querySelector("#ball");


/* =========================================================
   ACTIVE TARGET
   ========================================================= */

let activeTarget = null;


/* =========================================================
   FLOOR CORRECTION
   ========================================================= */

const FLOOR_CORRECTION =
    new THREE.Quaternion().setFromEuler(

        new THREE.Euler(
            -Math.PI / 2,
            0,
            0,
            "XYZ"
        )

    );


/* =========================================================
   IDENTITY
   ========================================================= */

const IDENTITY =
    new THREE.Quaternion();


/* =========================================================
   CAMERA VIDEO FIX
   =========================================================

   MindAR creates the camera video dynamically.

   We force the video element to remain visible
   and behind the transparent A-Frame canvas.
   ========================================================= */

function fixCameraVideo() {

    const videos =
        document.querySelectorAll("video");


    videos.forEach(function(video) {

        video.style.position = "fixed";

        video.style.top = "0px";

        video.style.left = "0px";

        video.style.width = "100vw";

        video.style.height = "100vh";

        video.style.objectFit = "cover";

        video.style.zIndex = "0";

        video.style.display = "block";

        video.style.visibility = "visible";

        video.style.opacity = "1";

    });


    const canvas =
        document.querySelector("canvas");


    if (canvas) {

        canvas.style.position = "fixed";

        canvas.style.top = "0px";

        canvas.style.left = "0px";

        canvas.style.width = "100vw";

        canvas.style.height = "100vh";

        canvas.style.zIndex = "1";

        canvas.style.background = "transparent";

    }

}


/* =========================================================
   RUN CAMERA FIX
   ========================================================= */

setTimeout(
    fixCameraVideo,
    100
);

setTimeout(
    fixCameraVideo,
    500
);

setTimeout(
    fixCameraVideo,
    1000
);

setTimeout(
    fixCameraVideo,
    2000
);


/* =========================================================
   OBSERVE NEW VIDEO ELEMENTS
   ========================================================= */

const observer =
    new MutationObserver(
        function() {

            fixCameraVideo();

        }
    );


observer.observe(
    document.body,
    {
        childList: true,
        subtree: true
    }
);


/* =========================================================
   ORIENTATION
   ========================================================= */

function applyOrientation(
    target,
    orientation
) {

    if (!target || !orientation) {
        return;
    }


    const normal =
        new THREE.Vector3(
            0,
            0,
            1
        );


    normal.applyQuaternion(
        target.object3D.quaternion
    );


    const isVertical =
        Math.abs(normal.y) < 0.5;


    if (isVertical) {

        orientation.object3D.quaternion.copy(
            IDENTITY
        );

    } else {

        orientation.object3D.quaternion.copy(
            FLOOR_CORRECTION
        );

    }

}


/* =========================================================
   ACTIVATE APPLE
   ========================================================= */

function activateApple() {

    activeTarget = 0;


    ball.setAttribute(
        "visible",
        false
    );


    apple.setAttribute(
        "visible",
        true
    );


    applyOrientation(
        appleTarget,
        appleOrientation
    );

}


/* =========================================================
   ACTIVATE BALL
   ========================================================= */

function activateBall() {

    activeTarget = 1;


    apple.setAttribute(
        "visible",
        false
    );


    ball.setAttribute(
        "visible",
        true
    );


    applyOrientation(
        ballTarget,
        ballOrientation
    );

}


/* =========================================================
   TARGET FOUND
   ========================================================= */

appleTarget.addEventListener(
    "targetFound",
    function() {

        activateApple();

    }
);


ballTarget.addEventListener(
    "targetFound",
    function() {

        activateBall();

    }
);


/* =========================================================
   TARGET LOST
   ========================================================= */

appleTarget.addEventListener(
    "targetLost",
    function() {

        if (activeTarget === 0) {

            apple.setAttribute(
                "visible",
                false
            );

            activeTarget = null;

        }

    }
);


ballTarget.addEventListener(
    "targetLost",
    function() {

        if (activeTarget === 1) {

            ball.setAttribute(
                "visible",
                false
            );

            activeTarget = null;

        }

    }
);


/* =========================================================
   ORIENTATION LOOP
   ========================================================= */

function orientationLoop() {

    if (activeTarget === 0) {

        applyOrientation(
            appleTarget,
            appleOrientation
        );

    }


    if (activeTarget === 1) {

        applyOrientation(
            ballTarget,
            ballOrientation
        );

    }


    requestAnimationFrame(
        orientationLoop
    );

}


orientationLoop();


/* =========================================================
   POINTER CONTROL
   ========================================================= */

let pointerDown = false;

let lastX = 0;

let lastY = 0;


/* =========================================================
   PINCH
   ========================================================= */

let pinchActive = false;

let initialPinchDistance = 0;

let initialScale = 4.54545;


/* =========================================================
   ACTIVE ROTATION
   ========================================================= */

function getActiveRotation() {

    if (activeTarget === 0) {

        return appleRotation;

    }


    if (activeTarget === 1) {

        return ballRotation;

    }


    return null;

}


/* =========================================================
   ACTIVE MODEL
   ========================================================= */

function getActiveModel() {

    if (activeTarget === 0) {

        return apple;

    }


    if (activeTarget === 1) {

        return ball;

    }


    return null;

}


/* =========================================================
   POINTER DOWN
   ========================================================= */

scene.addEventListener(
    "pointerdown",
    function(event) {

        pointerDown = true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

    }
);


/* =========================================================
   POINTER MOVE
   ========================================================= */

scene.addEventListener(
    "pointermove",
    function(event) {

        if (!pointerDown) {
            return;
        }


        if (pinchActive) {
            return;
        }


        const rotation =
            getActiveRotation();


        if (!rotation) {
            return;
        }


        const deltaX =
            event.clientX -
            lastX;


        const deltaY =
            event.clientY -
            lastY;


        rotation.object3D.rotation.y
            += deltaX * 0.01;


        rotation.object3D.rotation.x
            += deltaY * 0.01;


        lastX =
            event.clientX;

        lastY =
            event.clientY;

    }
);


/* =========================================================
   POINTER UP
   ========================================================= */

scene.addEventListener(
    "pointerup",
    function() {

        pointerDown = false;

    }
);


scene.addEventListener(
    "pointercancel",
    function() {

        pointerDown = false;

    }
);


/* =========================================================
   TOUCH DISTANCE
   ========================================================= */

function getTouchDistance(
    touch1,
    touch2
) {

    const dx =
        touch1.clientX -
        touch2.clientX;


    const dy =
        touch1.clientY -
        touch2.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   TOUCH START
   ========================================================= */

scene.addEventListener(
    "touchstart",
    function(event) {

        if (event.touches.length === 2) {

            event.preventDefault();


            pinchActive = true;


            initialPinchDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            const model =
                getActiveModel();


            if (model) {

                initialScale =
                    model.object3D.scale.x;

            }

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

scene.addEventListener(
    "touchmove",
    function(event) {

        if (
            event.touches.length === 2 &&
            pinchActive
        ) {

            event.preventDefault();


            const model =
                getActiveModel();


            if (!model) {
                return;
            }


            const currentDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            if (
                initialPinchDistance <= 0
            ) {

                return;

            }


            const ratio =
                currentDistance /
                initialPinchDistance;


            let newScale =
                initialScale * ratio;


            newScale =
                Math.max(
                    0.3,
                    Math.min(
                        15.0,
                        newScale
                    )
                );


            model.object3D.scale.set(
                newScale,
                newScale,
                newScale
            );

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
   ========================================================= */

scene.addEventListener(
    "touchend",
    function(event) {

        if (event.touches.length < 2) {

            pinchActive = false;

        }

    }
);


/* =========================================================
   PREVENT SCROLLING
   ========================================================= */

document.addEventListener(
    "touchmove",
    function(event) {

        if (event.touches.length > 0) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);

</script>


</body>
</html>
