<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>AR Children's Book</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- MediaPipe: recognizes a hand and its palm landmarks -->
  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    window.createHandLandmarker = async () => {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      return HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          delegate: "GPU",
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
        },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.55,
        minHandPresenceConfidence: 0.55,
        minTrackingConfidence: 0.55
      });
    };
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #mindar-camera-feed {
      position: fixed !important;
      inset: 0 !important;
      display: block !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      object-position: center !important;
      z-index: 0 !important;
      background: #000 !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    a-scene canvas {
      background: transparent !important;
      touch-action: none !important;
    }

    #ar-status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      transform: translateX(-50%);
      padding: 10px 15px;
      border-radius: 8px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    #ar-status.hidden {
      display: none;
    }

    .mindar-ui-loading,
    .mindar-ui-scanning,
    .mindar-ui-error {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="ar-status">Starting camera…</div>

  <audio id="sliceSound" src="./Slice.mp3" preload="auto"></audio>
  <audio id="appleSound" src="./Apple.mp3" preload="auto"></audio>

  <audio
    id="backgroundMusic"
    src="./Curious Discovery.mp3"
    preload="auto"
    autoplay
    loop
  ></audio>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiScanning: no;
      uiLoading: no;
      uiError: no;
      warmupTolerance: 3;
      missTolerance: 1;
      filterMinCF: 0.0005;
      filterBeta: 0.001;
      maxTrack: 1;
    "
    color-space="sRGB"
    renderer="
      alpha: true;
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item id="appleModel" src="./Apple.glb"></a-asset-item>
      <a-asset-item id="appleSliceModel" src="./AppleSlice.glb"></a-asset-item>
      <a-asset-item id="ballModel" src="./Ball.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 1.2"></a-entity>

    <a-entity
      light="type: directional; intensity: 1.5"
      position="1 2 1"
    ></a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- Apple trigger -->
    <a-entity
      id="appleTarget"
      mindar-image-target="targetIndex: 0"
    >
      <a-entity id="appleOrientation">
        <a-entity id="appleRotation">
          <a-gltf-model
            id="apple"
            src="#appleModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="4.54545 4.54545 4.54545"
            visible="false"
          ></a-gltf-model>

          <a-gltf-model
            id="appleSlice"
            src="#appleSliceModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="4.54545 4.54545 4.54545"
            visible="false"
          ></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Ball trigger -->
    <a-entity
      id="ballTarget"
      mindar-image-target="targetIndex: 1"
    >
      <a-entity id="ballOrientation">
        <a-entity id="ballRotation">
          <a-gltf-model
            id="ball"
            src="#ballModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="4.54545 4.54545 4.54545"
            visible="false"
          ></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const THREE = AFRAME.THREE;

      const scene = document.querySelector("a-scene");
      const status = document.querySelector("#ar-status");

      const appleTarget = document.querySelector("#appleTarget");
      const ballTarget = document.querySelector("#ballTarget");

      const apple = document.querySelector("#apple");
      const appleSlice = document.querySelector("#appleSlice");
      const ball = document.querySelector("#ball");

      const appleOrientation = document.querySelector("#appleOrientation");
      const ballOrientation = document.querySelector("#ballOrientation");

      const appleRotation = document.querySelector("#appleRotation");
      const ballRotation = document.querySelector("#ballRotation");

      const sliceSound = document.querySelector("#sliceSound");
      const appleSound = document.querySelector("#appleSound");
      const backgroundMusic = document.querySelector("#backgroundMusic");

      const BASE_SCALE = 4.54545;

      let activeTarget = null;
      let videoPlaced = false;

      let appleSoundPlayed = false;
      let appleSoundTimer = null;

      let appleIsSliced = false;
      let appleSliceAnimating = false;

      let ballIsBouncing = false;
      let ballReturnTimer = null;

      let handLandmarker = null;
      let handTrackingStarted = false;
      let lastVideoTime = -1;
      let lastHandSeenTime = 0;

      const ballMaterialStates = new Map();
      const tapStarts = new Map();

      const tapRaycaster = new THREE.Raycaster();
      const tapPointer = new THREE.Vector2();

      const worldUp = new THREE.Vector3(0, 1, 0);
      const modelUp = new THREE.Vector3(0, 1, 0);

      const targetWorldQuaternion = new THREE.Quaternion();
      const targetInverseQuaternion = new THREE.Quaternion();
      const upInTargetSpace = new THREE.Vector3();

      const cameraWorldPosition = new THREE.Vector3();
      const targetWorldPosition = new THREE.Vector3();
      const handWorldPosition = new THREE.Vector3();
      const handLocalPosition = new THREE.Vector3();
      const handDirection = new THREE.Vector3();
      const handNdc = new THREE.Vector3();

      let lastAnimationTime = performance.now();

      backgroundMusic.volume = 0.18;
      appleSound.volume = 1;
      sliceSound.volume = 0.9;

      function showStatus(message) {
        status.textContent = message;
        status.classList.remove("hidden");
      }

      function hideStatus() {
        status.classList.add("hidden");
      }

      function playSound(sound) {
        sound.pause();
        sound.currentTime = 0;

        return sound.play();
      }

      function startBackgroundMusic() {
        if (!backgroundMusic.paused) return;

        backgroundMusic.play().catch(() => {
          /*
            Mobile phones can block automatic audio.
            The first screen tap retries it.
          */
        });
      }

      function clearAppleSoundTimer() {
        if (appleSoundTimer) {
          clearTimeout(appleSoundTimer);
          appleSoundTimer = null;
        }
      }

      function scheduleAppleSound(delay = 2000) {
        clearAppleSoundTimer();

        if (appleSoundPlayed || activeTarget !== 0) return;

        appleSoundTimer = setTimeout(() => {
          if (activeTarget !== 0 || appleSoundPlayed) return;

          playSound(appleSound)
            .then(() => {
              appleSoundPlayed = true;
            })
            .catch(() => {
              appleSoundPlayed = false;
            });
        }, delay);
      }

      function resumeAudio() {
        startBackgroundMusic();

        if (activeTarget === 0 && !appleSoundPlayed) {
          scheduleAppleSound(0);
        }
      }

      function placeMindARCameraVideo() {
        if (videoPlaced) return true;

        const cameraVideo = Array.from(
          document.querySelectorAll("video")
        ).find((video) => video.srcObject !== null);

        if (!cameraVideo) return false;

        cameraVideo.id = "mindar-camera-feed";
        cameraVideo.setAttribute("playsinline", "");
        cameraVideo.setAttribute("webkit-playsinline", "");
        cameraVideo.muted = true;
        cameraVideo.autoplay = true;

        document.body.insertBefore(cameraVideo, scene);

        cameraVideo.play().catch(() => {});

        videoPlaced = true;
        hideStatus();

        startHandTracking();

        return true;
      }

      async function startHandTracking() {
        if (handTrackingStarted) return;

        /*
          The MediaPipe module may still be downloading during page startup.
        */
        if (!window.createHandLandmarker) {
          setTimeout(startHandTracking, 300);
          return;
        }

        handTrackingStarted = true;

        try {
          handLandmarker = await window.createHandLandmarker();
          handTrackingLoop();
        } catch (error) {
          handTrackingStarted = false;
          console.warn("Hand tracking could not start.", error);
        }
      }

      /*
        The palm center is calculated from:
        wrist, index-finger base, and little-finger base.
      */
      function updateHandPosition(landmarks) {
        const activeModel = getActiveModelElement();
        const activeTargetElement = getActiveTargetElement();

        if (!activeModel || !activeTargetElement || !scene.camera) return;

        const palmX = (
          landmarks[0].x +
          landmarks[5].x +
          landmarks[17].x
        ) / 3;

        const palmY = (
          landmarks[0].y +
          landmarks[5].y +
          landmarks[17].y
        ) / 3;

        scene.camera.getWorldPosition(cameraWorldPosition);

        activeTargetElement.object3D.getWorldPosition(
          targetWorldPosition
        );

        const targetDistance = Math.max(
          0.35,
          cameraWorldPosition.distanceTo(targetWorldPosition)
        );

        handNdc.set(
          palmX * 2 - 1,
          -(palmY * 2 - 1),
          0.5
        );

        handNdc.unproject(scene.camera);

        handDirection
          .subVectors(handNdc, cameraWorldPosition)
          .normalize();

        handWorldPosition
          .copy(cameraWorldPosition)
          .addScaledVector(handDirection, targetDistance);

        activeModel.object3D.parent.updateWorldMatrix(true, false);

        handLocalPosition.copy(handWorldPosition);

        activeModel.object3D.parent.worldToLocal(handLocalPosition);

        lastHandSeenTime = performance.now();
      }

      function handTrackingLoop() {
        if (!handLandmarker) return;

        const cameraVideo = document.querySelector(
          "#mindar-camera-feed"
        );

        if (
          cameraVideo &&
          cameraVideo.readyState >= 2 &&
          cameraVideo.currentTime !== lastVideoTime
        ) {
          lastVideoTime = cameraVideo.currentTime;

          const result = handLandmarker.detectForVideo(
            cameraVideo,
            performance.now()
          );

          if (result.landmarks && result.landmarks.length > 0) {
            updateHandPosition(result.landmarks[0]);
          }
        }

        requestAnimationFrame(handTrackingLoop);
      }

      /*
        Smoothly moves the object toward the hand in about 0.5 seconds.
        When the hand disappears, it returns smoothly to position 0 0 0.
      */
      function updateObjectHandFollow(deltaSeconds) {
        const activeModel = getActiveModelElement();

        if (!activeModel || !activeModel.object3D.visible) return;

        if (activeTarget === 1 && ballIsBouncing) return;
        if (activeTarget === 0 && appleSliceAnimating) return;

        const handIsVisible =
          performance.now() - lastHandSeenTime < 250;

        const smoothAmount = 1 - Math.exp(-8 * deltaSeconds);

        if (handIsVisible) {
          activeModel.object3D.position.lerp(
            handLocalPosition,
            smoothAmount
          );
        } else {
          activeModel.object3D.position.lerp(
            new THREE.Vector3(0, 0, 0),
            smoothAmount
          );
        }
      }

      function applyStandingOrientation(target, orientation) {
        if (!target.object3D || !orientation.object3D) return;

        target.object3D.getWorldQuaternion(targetWorldQuaternion);

        targetInverseQuaternion
          .copy(targetWorldQuaternion)
          .invert();

        upInTargetSpace
          .copy(worldUp)
          .applyQuaternion(targetInverseQuaternion)
          .normalize();

        orientation.object3D.quaternion.setFromUnitVectors(
          modelUp,
          upInTargetSpace
        );
      }

      function showWholeApple() {
        appleSlice.object3D.position.set(0, 0, 0);
        appleSlice.object3D.rotation.set(0, 0, 0);

        appleSlice.setAttribute("visible", "false");
        apple.setAttribute("visible", "true");

        appleIsSliced = false;
        appleSliceAnimating = false;
      }

      function sliceApple() {
        if (
          activeTarget !== 0 ||
          appleIsSliced ||
          appleSliceAnimating
        ) {
          return;
        }

        appleSliceAnimating = true;

        playSound(sliceSound).catch(() => {});

        apple.setAttribute("visible", "false");

        appleSlice.object3D.position.set(0, 0, 0);
        appleSlice.object3D.rotation.set(0, 0, 0);

        appleSlice.setAttribute("visible", "true");

        const startTime = performance.now();
        const duration = 350;

        function animateSlice(currentTime) {
          const progress = Math.min(
            (currentTime - startTime) / duration,
            1
          );

          const easeOut = 1 - Math.pow(1 - progress, 3);

          appleSlice.object3D.position.set(
            0,
            easeOut * 0.08,
            easeOut * 0.08
          );

          appleSlice.object3D.rotation.y = easeOut * 0.18;

          if (progress < 1) {
            requestAnimationFrame(animateSlice);
            return;
          }

          appleIsSliced = true;
          appleSliceAnimating = false;
        }

        requestAnimationFrame(animateSlice);
      }

      function rememberBallMaterials() {
        ball.object3D.traverse((object) => {
          if (!object.isMesh) return;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach((material) => {
            if (!material || ballMaterialStates.has(material)) return;

            ballMaterialStates.set(material, {
              opacity: material.opacity,
              transparent: material.transparent
            });
          });
        });
      }

      function setBallOpacity(opacity) {
        ball.object3D.traverse((object) => {
          if (!object.isMesh) return;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          materials.forEach((material) => {
            if (!material) return;

            material.transparent = true;
            material.opacity = opacity;
            material.needsUpdate = true;
          });
        });
      }

      function restoreBallMaterials() {
        ballMaterialStates.forEach((state, material) => {
          material.opacity = state.opacity;
          material.transparent = state.transparent;
          material.needsUpdate = true;
        });
      }

      function resetBall() {
        ball.object3D.position.set(0, 0, 0);
        restoreBallMaterials();

        ballIsBouncing = false;

        if (activeTarget === 1) {
          ball.setAttribute("visible", "true");
        }
      }

      function bounceBall() {
        if (activeTarget !== 1 || ballIsBouncing) return;

        ballIsBouncing = true;

        if (ballReturnTimer) {
          clearTimeout(ballReturnTimer);
        }

        const startTime = performance.now();
        const duration = 420;

        function animateBounce(currentTime) {
          const progress = Math.min(
            (currentTime - startTime) / duration,
            1
          );

          const upwardArc = Math.sin(progress * Math.PI) * 0.75;

          ball.object3D.position.set(
            progress * 0.7,
            upwardArc,
            progress * 0.45
          );

          setBallOpacity(1 - progress);

          if (progress < 1) {
            requestAnimationFrame(animateBounce);
            return;
          }

          ball.setAttribute("visible", "false");

          ballReturnTimer = setTimeout(() => {
            resetBall();
          }, 500);
        }

        requestAnimationFrame(animateBounce);
      }

      function didTapObject(event, objectElement) {
        if (
          !scene.canvas ||
          !scene.camera ||
          !objectElement.object3D ||
          !objectElement.object3D.visible
        ) {
          return false;
        }

        const bounds = scene.canvas.getBoundingClientRect();

        tapPointer.x =
          ((event.clientX - bounds.left) / bounds.width) * 2 - 1;

        tapPointer.y =
          -((event.clientY - bounds.top) / bounds.height) * 2 + 1;

        tapRaycaster.setFromCamera(tapPointer, scene.camera);

        return tapRaycaster.intersectObject(
          objectElement.object3D,
          true
        ).length > 0;
      }

      function getActiveTargetElement() {
        if (activeTarget === 0) return appleTarget;
        if (activeTarget === 1) return ballTarget;

        return null;
      }

      function getActiveModelElement() {
        if (activeTarget === 0) {
          return appleIsSliced
            ? appleSlice
            : apple;
        }

        if (activeTarget === 1) {
          return ball;
        }

        return null;
      }

      function getActiveRotationObject() {
        if (activeTarget === 0) return appleRotation.object3D;
        if (activeTarget === 1) return ballRotation.object3D;

        return null;
      }

      function getActiveModelObject() {
        const element = getActiveModelElement();

        return element ? element.object3D : null;
      }

      ball.addEventListener("model-loaded", () => {
        rememberBallMaterials();
      });

      function showApple() {
        activeTarget = 0;
        appleSoundPlayed = false;

        ball.setAttribute("visible", "false");

        if (appleIsSliced) {
          apple.setAttribute("visible", "false");
          appleSlice.setAttribute("visible", "true");
        } else {
          showWholeApple();
        }

        applyStandingOrientation(appleTarget, appleOrientation);
        scheduleAppleSound(2000);
      }

      function showBall() {
        activeTarget = 1;
        appleSoundPlayed = false;

        clearAppleSoundTimer();

        apple.setAttribute("visible", "false");
        appleSlice.setAttribute("visible", "false");

        if (!ballIsBouncing) {
          resetBall();
        }

        ball.setAttribute("visible", "true");

        applyStandingOrientation(ballTarget, ballOrientation);
      }

      appleTarget.addEventListener("targetFound", showApple);
      ballTarget.addEventListener("targetFound", showBall);

      appleTarget.addEventListener("targetLost", () => {
        if (activeTarget !== 0) return;

        apple.setAttribute("visible", "false");
        appleSlice.setAttribute("visible", "false");

        activeTarget = null;
        appleSoundPlayed = false;

        clearAppleSoundTimer();
      });

      ballTarget.addEventListener("targetLost", () => {
        if (activeTarget !== 1) return;

        ball.setAttribute("visible", "false");
        activeTarget = null;
      });

      function trackingLoop(currentTime) {
        const deltaSeconds = Math.min(
          (currentTime - lastAnimationTime) / 1000,
          0.1
        );

        lastAnimationTime = currentTime;

        if (activeTarget === 0) {
          applyStandingOrientation(appleTarget, appleOrientation);
        }

        if (activeTarget === 1) {
          applyStandingOrientation(ballTarget, ballOrientation);
        }

        updateObjectHandFollow(deltaSeconds);

        requestAnimationFrame(trackingLoop);
      }

      requestAnimationFrame(trackingLoop);

      const pointers = new Map();

      let rotating = false;
      let pinching = false;

      let lastX = 0;
      let lastY = 0;

      let pinchStartDistance = 0;
      let pinchStartScale = BASE_SCALE;

      function currentPointerDistance() {
        const values = Array.from(pointers.values());

        const dx = values[0].x - values[1].x;
        const dy = values[0].y - values[1].y;

        return Math.sqrt(dx * dx + dy * dy);
      }

      scene.addEventListener("pointerdown", (event) => {
        resumeAudio();

        if (activeTarget === null || ballIsBouncing) return;

        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        tapStarts.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        if (pointers.size === 1) {
          rotating = true;
          pinching = false;

          lastX = event.clientX;
          lastY = event.clientY;
        }

        if (pointers.size === 2) {
          rotating = false;
          pinching = true;

          pinchStartDistance = currentPointerDistance();

          const model = getActiveModelObject();

          if (model) {
            pinchStartScale = model.scale.x;
          }
        }
      });

      scene.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId) || ballIsBouncing) return;

        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });

        if (pointers.size === 1 && rotating) {
          const rotationObject = getActiveRotationObject();

          if (!rotationObject) return;

          const dx = event.clientX - lastX;
          const dy = event.clientY - lastY;

          rotationObject.rotation.y += dx * 0.01;
          rotationObject.rotation.x += dy * 0.01;

          lastX = event.clientX;
          lastY = event.clientY;
        }

        if (pointers.size === 2 && pinching && pinchStartDistance > 0) {
          const factor = currentPointerDistance() / pinchStartDistance;

          let newScale = pinchStartScale * factor;

          newScale = Math.max(0.3, Math.min(15, newScale));

          const model = getActiveModelObject();

          if (model) {
            model.scale.set(newScale, newScale, newScale);
          }
        }
      });

      function finishPointer(event) {
        const tapStart = tapStarts.get(event.pointerId);

        if (
          event.type === "pointerup" &&
          tapStart &&
          pointers.size === 1
        ) {
          const movedX = event.clientX - tapStart.x;
          const movedY = event.clientY - tapStart.y;

          const tapDistance = Math.sqrt(
            movedX * movedX + movedY * movedY
          );

          if (tapDistance < 12) {
            if (activeTarget === 0) {
              if (!appleIsSliced && didTapObject(event, apple)) {
                sliceApple();
              } else if (
                appleIsSliced &&
                didTapObject(event, appleSlice)
              ) {
                showWholeApple();
              }
            }

            if (
              activeTarget === 1 &&
              !ballIsBouncing &&
              didTapObject(event, ball)
            ) {
              bounceBall();
            }
          }
        }

        pointers.delete(event.pointerId);
        tapStarts.delete(event.pointerId);

        if (pointers.size === 0) {
          rotating = false;
          pinching = false;
        }

        if (pointers.size === 1) {
          rotating = true;
          pinching = false;

          const remainingPointer = Array.from(pointers.values())[0];

          lastX = remainingPointer.x;
          lastY = remainingPointer.y;
        }
      }

      scene.addEventListener("pointerup", finishPointer);
      scene.addEventListener("pointercancel", finishPointer);
      scene.addEventListener("pointerleave", finishPointer);

      scene.addEventListener(
        "touchstart",
        (event) => event.preventDefault(),
        { passive: false }
      );

      scene.addEventListener(
        "touchmove",
        (event) => event.preventDefault(),
        { passive: false }
      );

      scene.addEventListener(
        "touchend",
        (event) => event.preventDefault(),
        { passive: false }
      );
    });
  </script>
</body>
</html>
